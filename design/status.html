<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>状态页 · 知命（暂名）原型</title>
<style>
:root{
  --paper:#F4EEE2; --paper-2:#FBF8F2; --paper-3:#ECE4D4;
  --ink:#2A2521; --ink-2:#5C534A; --ink-3:#8F857A; --line:#DCD2C1; --line-2:#E9E1D3;
  --zhu:#A93226; --zhu-d:#8E2A20; --zhu-bg:#F6E6E0;
  --serif:"Songti SC","STSong","Noto Serif SC","Noto Serif CJK SC","Source Han Serif SC","SimSun",serif;
  --sans:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans CJK SC",sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.7;background:#E7E1D6}
a{color:var(--ink-2)}
.btn{display:flex;align-items:center;justify-content:center;width:100%;height:50px;border:0;border-radius:4px;font-family:var(--serif);font-size:17px;letter-spacing:2px;cursor:pointer;text-decoration:none}
.btn-primary{background:var(--zhu);color:#FBF3EC}
.btn-line{background:transparent;border:1px solid var(--ink-2);color:var(--ink)}
.btn-text{background:none;color:var(--ink-2);font-family:var(--sans);font-size:14px;letter-spacing:0;height:40px}
.hint{font-size:12.5px;color:var(--ink-3);line-height:1.6}
.board-head{max-width:1240px;margin:0 auto;padding:24px 20px 4px}
.board-head h1{font-family:var(--serif);font-size:22px;letter-spacing:2px}
.board-head p{font-size:13.5px;color:var(--ink-2);margin-top:4px;max-width:820px}
.board-head a{font-size:13px}
.board{max-width:1240px;margin:0 auto;padding:16px 20px 40px;display:flex;flex-wrap:wrap;gap:28px}
figure{width:375px;max-width:100%}
figcaption{font-size:13px;color:var(--ink-2);margin-bottom:8px;line-height:1.5;min-height:58px}
figcaption b{font-family:var(--serif);font-size:15px;color:var(--ink);display:block}
.phone{position:relative;width:375px;max-width:100%;height:700px;overflow:hidden;border:1px solid #CFC5B4;border-radius:22px;box-shadow:0 2px 18px rgba(60,40,20,.08);
  background:var(--paper) url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .42 0 0 0 0 .35 0 0 0 0 .25 0 0 0 .07 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
.bar-wx{height:44px;display:flex;align-items:center;justify-content:center;font-size:15px;background:#EDEDED;color:#111;border-bottom:1px solid #ddd;position:relative}
.bar-wx::after{content:"···";position:absolute;right:14px}
.state{display:flex;flex-direction:column;align-items:center;text-align:center;padding:64px 26px 24px}
.state h2{font-family:var(--serif);font-size:21px;font-weight:600;margin:18px 0 8px;letter-spacing:1px}
.state p{font-size:14px;color:var(--ink-2)}
.state .acts{width:100%;margin-top:24px;display:flex;flex-direction:column;gap:10px}
.mark{width:52px;height:52px;border:1.5px solid var(--ink-3);border-radius:4px;display:flex;align-items:center;justify-content:center;font-family:var(--serif);color:var(--ink-3);font-size:24px}
.reasons{text-align:left;font-size:13.5px;color:var(--ink-2);background:var(--paper-2);border:1px solid var(--line-2);border-radius:4px;padding:10px 12px 10px 28px;margin-top:16px;width:100%}
.reasons li{margin:2px 0}
.ring{width:44px;height:44px;border-radius:50%;border:2px solid var(--line);border-top-color:var(--zhu);animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
/* 骨架 */
.sk{padding:18px}
.sk .b{background:linear-gradient(90deg,var(--paper-3),#F3ECDF,var(--paper-3));background-size:200% 100%;animation:sh 1.4s ease infinite;border-radius:3px;margin-bottom:10px}
@keyframes sh{to{background-position:-200% 0}}
.sk .cap{text-align:center;font-size:13px;color:var(--ink-3);margin:6px 0 16px}
</style>
</head>
<body>
<div class="board-head">
  <a href="index.html">← 原型目录</a>
  <h1>报告访问与异常状态（画板）</h1>
  <p>报告链接 <code>/r/订单号#出生信息</code> 打开时，服务器核对「已付款 + 出生信息指纹匹配」。按架构要求，未付款、已退款、指纹不匹配<b>统一显示同一个页面</b>，不区分原因；只有「链接不完整」能由浏览器本地判断，可以单独提示。报告检查告警（R-CHECK）在用户侧照常显示报告，没有单独页面。</p>
</div>

<div class="board">
  <figure>
    <figcaption><b>1 · 报告加载中</b>前端读取链接后提交核对，服务端排盘 + 拼装通常不到 1 秒。用骨架屏，不放转圈全屏遮罩。</figcaption>
    <div class="phone">
      <div class="bar-wx">命书</div>
      <div class="sk">
        <div class="b" style="height:44px"></div>
        <div class="cap">正在核对订单并排盘……</div>
        <div class="b" style="height:210px"></div>
        <div class="b" style="height:16px;width:60%"></div>
        <div class="b" style="height:16px"></div>
        <div class="b" style="height:16px;width:85%"></div>
        <div class="b" style="height:120px;margin-top:18px"></div>
      </div>
    </div>
  </figure>

  <figure>
    <figcaption><b>2 · 链接无效或订单未支付（统一页）</b>不告诉用户具体是哪种原因（防止被用来试探订单状态），只列可能原因和下一步。</figcaption>
    <div class="phone">
      <div class="bar-wx">命书</div>
      <div class="state">
        <div class="mark">闭</div>
        <h2>这个链接打不开报告</h2>
        <p>可能是以下原因之一：</p>
        <ul class="reasons">
          <li>订单还没有支付成功，或已经退款</li>
          <li>链接被修改过（例如出生信息被改动）</li>
          <li>复制时只复制了一部分</li>
        </ul>
        <div class="acts">
          <a class="btn btn-line" href="legal.html#contact">已付款？联系我们核对</a>
          <a class="btn btn-text" href="home.html">回到首页重新排盘</a>
        </div>
        <p class="hint" style="margin-top:6px">联系时请提供支付账单里的「商户订单号」。我们不保存出生信息，需要你提供原链接或重新填写出生信息来核对。</p>
      </div>
    </div>
  </figure>

  <figure>
    <figcaption><b>3 · 链接不完整</b>链接里 # 后面的部分缺失或无法解析（浏览器本地就能判断，不需要请求服务器）。</figcaption>
    <div class="phone">
      <div class="bar-wx">命书</div>
      <div class="state">
        <div class="mark">缺</div>
        <h2>链接不完整</h2>
        <p>这个链接缺少了后半段，通常是复制或转发时被截断了。请找到完整的原链接重新打开（微信「收藏」或聊天记录里的那一条）。</p>
        <div class="acts">
          <a class="btn btn-line" href="legal.html#contact">找不到原链接？联系我们</a>
          <a class="btn btn-text" href="home.html">回到首页</a>
        </div>
      </div>
    </div>
  </figure>

  <figure>
    <figcaption><b>4 · 网络错误</b>请求失败或超时。报告不在服务器保存，重试即可重新生成，内容不变。</figcaption>
    <div class="phone">
      <div class="bar-wx">命书</div>
      <div class="state">
        <div class="mark">断</div>
        <h2>网络不太顺畅</h2>
        <p>没能连上服务器。你的订单和链接都没有问题，重试即可，报告内容不会变。</p>
        <div class="acts"><a class="btn btn-primary" href="report.html">重试</a></div>
      </div>
    </div>
  </figure>

  <figure>
    <figcaption><b>5 · 免费排盘失败（输入问题）</b>服务端返回错误码（如农历闰月不存在、夏令时不存在的时刻），映射成人话，不回显输入值。</figcaption>
    <div class="phone">
      <div class="bar-wx">八字结果</div>
      <div class="state">
        <div class="mark">误</div>
        <h2>这个时间无法排盘</h2>
        <p>1988 年 4 月 17 日 02:00–02:59 在夏令时切换中被跳过，钟表上不存在这个时刻。请核对出生证上的时间。</p>
        <div class="acts"><a class="btn btn-primary" href="home.html">返回修改</a></div>
      </div>
    </div>
  </figure>

  <figure>
    <figcaption><b>6 · 页面不存在（404）</b></figcaption>
    <div class="phone">
      <div class="bar-wx">知命</div>
      <div class="state">
        <div class="mark">无</div>
        <h2>没有找到这个页面</h2>
        <p>如果你在找自己的报告，请使用付款后保存的完整链接。</p>
        <div class="acts"><a class="btn btn-primary" href="home.html">回到首页</a></div>
      </div>
    </div>
  </figure>
</div>
</body>
</html>
