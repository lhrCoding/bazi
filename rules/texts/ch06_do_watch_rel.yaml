# 第 6 章 槽位 CH6-DO「适合做」、CH6-WATCH「留意」、CH6-REL「年度冲合」（第 1 批 B1，草稿）
# CH6-DO / CH6-WATCH：维度 item.stem_god（5）× item.tier_group（3）= 15 / 槽位；每条 30–60 字，1–2 句，2 个变体；各 1 条兜底。
#   润色 = 否。必须可执行（具体动作），不写“保持积极心态”之类空话；不写具体月份（无数据可追溯）。
# CH6-REL：非必需，关系类型 4 种（冲日支 / 冲月支 / 合日支 / 冲时支），每条 40–60 字，无兜底。
#   触发写法：{f: item.relations, contains: {type, a, b}}——item.relations 是对象列表，
#   需要条件求值器支持“对象按字段全等匹配”的 contains（README §4.1 未写明，见 batches.yaml 待开发确认）。
#   冲时支条目 requires_hour: true（三柱时不计算、不展示）。
#   冲日支只写“变动较多，适合主动规划”，不写分手、婚变。

