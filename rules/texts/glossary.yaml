# 术语加注表（K01）：术语在报告中首次出现时自动加注（README §8）。
# 初版与 README §8 示例逐字一致；发布时随素材快照一起冻结，已售报告的加注不随本文件后续修改而变化。
- term: 日主
  note: 你出生那天的天干，代表你自己
- term: 比劫
  note: 和你同类、能帮你的力量
- term: 印星
  note: 生扶你、给你支持的力量
- term: 食伤
  note: 你向外输出的才华与表达
- term: 财星
  note: 你能掌握和运用的资源
- term: 官杀
  note: 外部的规则、要求与压力，也是推动力
- term: 七杀
  note: 力度较强的压力与挑战，也逼你成长
- term: 用神
  note: 对你最有帮助的五行
- term: 喜神
  note: 次一级、同样有利的五行
- term: 忌神
  note: 过多时容易让你失衡、需要节制的五行
- term: 调候
  note: 按出生季节的冷暖做的调整
- term: 通关
  note: 用第三种五行连接两种对立的力量
- term: 大运
  note: 每十年一段的整体运势背景
- term: 流年
  note: 某一年的运势
