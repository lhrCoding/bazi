# 第 1 章 槽位 CH1-CONCLUSION「结论」与 CH1-QUOTE「古籍一句」（第 1 批 B1，草稿）
#
# CH1-CONCLUSION：维度 strength.level（6）；修饰字段 strength.borderline、profile.time_known、profile.confidence。
#   - 普通条目（priority 50）：6 个等级各 1 条，修饰字段取默认值（borderline=false、time_known=true、confidence=高）时使用。
#   - 贴线条目（priority 60）：borderline=true，6 个等级各 1 条。
#   - 无时辰条目（priority 70）：time_known=false × 置信（高/中/低）× 方向（偏弱组/偏旺组）= 6 条。三柱不判从格，等级只会是 4 种普通等级。
#     无时辰且贴线时，无时辰条目优先（置信度信息比贴线更重要）。
#   - 结论段“润色 = 否”。每条 80–130 字，2 个变体；另 1 条兜底。
#   - L7：正文不出现“时柱 / 时干 / 时支 / 出生时辰”，只用“时辰”，所以无时辰条目不需要 requires_hour。
#
# CH1-QUOTE：非必需槽位，维度 strength.direction / strength.special（另用 level 区分中和）。
#   本批起第 1 章古籍引文只放在这里（DAYMASTER 不再带 quote）。正文是一句 20–60 字的引子，原文由引擎单独成行放在段后。
#   全部 verified=false（未核对底本），上线前须逐字对照并填写 edition。

# ======================= CH1-CONCLUSION 普通条目 =======================
- id: CH1-CONCLUSION-SHENRUO
  slot: CH1-CONCLUSION
  when: {all: [{f: strength.level, eq: 身弱}]}
  asserts: []
  priority: 50
  length: [80, 130]
  polish_allowed: false
  variants:
    - "综合来看，你的日主属于“身弱”：帮扶力量占 {strength.S_pct}%，不到一半。身弱不等于能力弱，也不等于运气差，它描述的是一种结构——你更适合借助平台、团队和资源发力，而不是凡事单打独斗。下一章的喜用神，讲的就是哪些力量能把这一块补上。"
    - "结论是“身弱”。帮扶你的力量占 {strength.S_pct}%，消耗你的力量占 {strength.yidang_pct}%。在命理里，这只说明你的能量需要借力才能发挥得更充分：选对环境、找对合作的人，往往比硬扛更有效。具体借哪几种力量，见下一章。"
  status: draft
  author: mingli-expert
  reviewer: null
  updated: 2026-10-29
  notes: "样板并入 B1，正文未改（第二变体去掉了“借力”外的引号以免与术语引号混淆）。修饰字段默认值下使用；贴线、无时辰各有专用条目。"

- id: CH1-CONCLUSION-ZHONGHE-RUO
  slot: CH1-CONCLUSION
  when: {all: [{f: strength.level, eq: 中和偏弱}]}
  asserts: []
  priority: 50
  length: [80, 130]
  polish_allowed: false
  variants:
    - "综合来看，你的日主属于“中和偏弱”：帮扶力量占 {strength.S_pct}%，略少于一半，但离平衡点不远。这是一种比较好调整的结构，不需要大补，适当借力就能把状态拉回平衡。下一章会说明哪几种力量最适合用来补上这一点差距。"
    - "结论是“中和偏弱”。帮扶你的力量占 {strength.S_pct}%，消耗你的力量占 {strength.yidang_pct}%，两边相差不大。这类结构的人多数时候能自己应付，压力集中时才会感到吃力；所以重点不是改变自己，而是在关键阶段找到合适的支持。具体是哪些五行，见下一章。"
  status: draft
  author: mingli-expert
  reviewer: null
  updated: 2026-10-29

