# ======================= CH1-CONCLUSION 无时辰条目（time_known=false） =======================
- id: CH1-CONCLUSION-NOHOUR-RUO-GAO
  slot: CH1-CONCLUSION
  when: {all: [{f: profile.time_known, eq: false}, {f: profile.confidence, eq: 高}, {f: strength.level, in: [身弱, 中和偏弱]}]}
  asserts: [{f: strength.direction, eq: 偏弱}]
  priority: 70
  length: [80, 130]
  polish_allowed: false
  variants:
    - "综合来看，你的日主属于“{strength.level}”，帮扶力量占 {strength.S_pct}%。因为没有时辰信息，本报告按三柱计算，并把一天里所有可能的时辰逐一补上试算：绝大多数情况下结论都是偏弱，用神也基本一致，所以可信度为“高”。"
    - "结论是“{strength.level}”，帮扶力量 {strength.S_pct}%。你没有提供时辰，所以本报告只用年、月、日三柱计分，又把每个可能的时辰都代入验算了一遍：结论在绝大多数时辰下保持偏弱，因此可信度定为“高”，下一章可以照常参考。"
  status: draft
  author: mingli-expert
  reviewer: null
  updated: 2026-10-29
  notes: "置信“高”= 方向一致 ≥80% 且用神一致 ≥75%（strength.md §5），“绝大多数”“基本一致”与此相符。"

- id: CH1-CONCLUSION-NOHOUR-RUO-ZHONG
  slot: CH1-CONCLUSION
  when: {all: [{f: profile.time_known, eq: false}, {f: profile.confidence, eq: 中}, {f: strength.level, in: [身弱, 中和偏弱]}]}
  asserts: [{f: strength.direction, eq: 偏弱}]
  priority: 70
  length: [80, 130]
  polish_allowed: false
  variants:
    - "综合来看，按三柱计算，你的日主属于“{strength.level}”，帮扶力量占 {strength.S_pct}%。由于没有时辰信息，本报告把每个可能的时辰代入验算：多数时辰下结论是偏弱，但也有一部分时辰会偏旺，所以可信度为“中”，这个结论大概率成立，但不是百分之百。"
    - "结论是“{strength.level}”，可信度“中”。没有时辰时只能用三柱计分，帮扶力量为 {strength.S_pct}%；把可能的时辰逐一代入后，大多数结果仍是偏弱，少数会变成偏旺。如果你日后查到准确时辰，重新排一次会得到更确定的结论。"
  status: draft
  author: mingli-expert
  reviewer: null
  updated: 2026-10-29

- id: CH1-CONCLUSION-NOHOUR-RUO-DI
  slot: CH1-CONCLUSION
  when: {all: [{f: profile.time_known, eq: false}, {f: profile.confidence, eq: 低}, {f: strength.level, in: [身弱, 中和偏弱]}]}
  asserts: [{f: strength.direction, eq: 偏弱}]
  priority: 70
  length: [80, 130]
  polish_allowed: false
  variants:
    - "按三柱计算，你的日主暂判为“{strength.level}”，帮扶力量占 {strength.S_pct}%。但要坦白说明：缺少时辰时，把不同时辰代入验算，偏弱和偏旺的结果都不少，所以可信度只有“低”。本章和下一章的结论请仅作参考，有条件的话补上时辰重新排盘会更可靠。"
    - "暂定结论是“{strength.level}”，可信度“低”。主要原因是缺少时辰：三柱算出的帮扶力量为 {strength.S_pct}%，可一旦代入不同的时辰，结果在偏弱与偏旺之间摇摆较大。本报告不回避这一点，后面的内容请当作参考；若能查到出生时间，建议重新排一次。"
  status: draft
  author: mingli-expert
  reviewer: null
  updated: 2026-10-29
  notes: "置信“低”也可能来自交节日年月柱不确定（strength.md §5 第 5 条），其根源仍是缺时辰，故写“主要原因”。"

