  asserts: [{f: strength.direction, eq: 偏弱}]
  priority: 50
  length: [80, 130]
  polish_allowed: false
  variants:
    - "综合来看，你的命局属于特殊的“从弱”一类：帮扶力量只有 {strength.S_pct}%，而且日主无根。这种情况不按“身弱就补”来处理，而是顺着命局里最强的力量走。这一点会直接决定下一章的喜忌方向，与普通身弱命局大致相反。"
    - "结论：你的命局属于“从弱”格局，帮扶力量 {strength.S_pct}%，日主在地支中没有可依靠的根。这类命局比较少见，本报告的判定条件也定得很严。它的含义不是“弱”，而是“顺”：顺着最强的那股力量发展，往往比逆势去补更合适。喜忌细节见下一章。"
  status: draft
  author: mingli-expert
  reviewer: null
  updated: 2026-10-29
  notes: "“大致相反”：从儿不忌比劫（列闲神），所以不写“完全相反”。"

