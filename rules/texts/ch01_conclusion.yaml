    - "结论：你的命局属于“从强”一类，帮扶力量 {strength.S_pct}%，能制约你的力量非常少。这类命局比较少见，本报告的判定条件也定得很严。它提示的方向是顺势：专注发挥自己最强的那一面，往往比勉强去补短板更有效。具体喜忌见下一章。"
