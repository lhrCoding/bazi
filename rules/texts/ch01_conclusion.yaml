    - "结论是“中和偏旺”。帮扶力量 {strength.S_pct}%、消耗力量 {strength.yidang_pct}%，你这一方稍占上风。状态均衡、略偏主动，是这类命局常见的底色。偏旺的那一点不需要压制，而是需要合适的去处：把它投到能产出结果的事情上，效果最好。具体方向见下一章。"
