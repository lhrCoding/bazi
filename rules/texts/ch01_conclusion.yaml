# ======================= CH1-CONCLUSION 贴线条目（borderline=true） =======================
- id: CH1-CONCLUSION-BL-SHENRUO
  slot: CH1-CONCLUSION
  when: {all: [{f: strength.level, eq: 身弱}, {f: strength.borderline, eq: true}]}
  asserts: []
  priority: 60
  length: [80, 130]
  polish_allowed: false
  variants:
    - "综合来看，你的日主属于“身弱”，帮扶力量占 {strength.S_pct}%。需要说明的是，这个数值离分档线不到一个百分点，所以更准确的说法是“偏弱”，而不是明显的弱。后面的喜忌仍按偏弱推导，但它的力度你可以理解得温和一些。"
    - "结论是“身弱”，不过属于贴着分档线的情况：帮扶力量 {strength.S_pct}%，与相邻档位只差不到一个百分点。命理判断本来就有边界上的模糊地带，本报告如实告诉你：方向是偏弱，程度并不重。读下一章时，可以把“需要帮扶”理解为“适当借力”。"
  status: draft
  author: mingli-expert
  reviewer: null
  updated: 2026-10-29
  notes: "身弱贴线可能贴 0.40（邻中和偏弱）也可能贴 0.20（但从格其余条件不满足），故只写“分档线 / 相邻档位”，不点名是哪一档。strength.md §4.3 要求贴线时用“偏……”措辞。"

- id: CH1-CONCLUSION-BL-ZHONGHE-RUO
