    - "结论是“中和偏弱”，而且是贴着分档线的那一种：帮扶力量 {strength.S_pct}%，再多或再少一点点就会换档。这样的命局弹性很大，环境和选择的影响往往比结构本身更明显。下一章的喜忌按偏弱的方向给出，你可以把它当作微调的参考。"
  status: draft
  author: mingli-expert
  reviewer: null
  updated: 2026-10-29
  notes: "可能贴 0.40 或 0.45，正文不点名相邻档位。"

