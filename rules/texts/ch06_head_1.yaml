# 第 6 章 槽位 CH6-HEAD「年度主题」第 1 部分（第 1 批 B1，草稿）
# 维度：item.stem_ten_god（10）× item.tier（5）= 50；本文件含 比肩、劫财、食神、伤官、偏财 共 25 条，其余在 ch06_head_2.yaml。
# 每条 80–120 字，2 个变体。循环槽位：5 年流年天干两两不同，所以同一条 HEAD 在一份报告里不会被选两次。
# 写法约定：
#   - 十神名、tier 标签由 when 锁定，可直接写出；年份、干支只能用占位符（本批 HEAD 未使用）。
#   - tier 由流年天干、地支与所在大运共同计分得出（report-sections.md §8.2），所以 HEAD 不写“X 是你的喜神 / 忌神”，
#     只按 tier 定语气：顺势期、向好 → 积极；平稳 → 中性；宜稳守、宜保守、打基础 → 谨慎但不恐吓。
#   - 不出现：灾、凶、破财、血光、贵人年 等（R-CHECK 禁用词）；不写具体月份（没有月份数据可追溯）。
# tier 代码：SHUN=顺势期、HAO=向好、PING=平稳、WEN=宜稳守、BAO=宜保守、打基础。

# ---------- 比肩 ----------
- id: CH6-HEAD-BIJIAN-SHUN
  slot: CH6-HEAD
  when: {all: [{f: item.stem_ten_god, eq: 比肩}, {f: item.tier, eq: 顺势期}]}
  priority: 50
  length: [80, 120]
  polish_allowed: true
  variants:
    - "这一年天干透出比肩，主题是自己做主。整体评分处在最好的“顺势期”，同类的力量在帮你：适合独立负责一摊事、开启个人项目，或与志同道合的人结伴发力。你的主见此时更容易被认可，可以大胆一点。"
    - "比肩当头的年份，讲的是独立与同伴。今年评分为“顺势期”，自我的力量与外部环境配合得好，想单干、想牵头、想换一种更自主的工作方式，都有比较好的条件。把握节奏，别把好势头耗在小事上。"
  status: draft
  author: mingli-expert
  reviewer: null
  updated: 2026-10-29

- id: CH6-HEAD-BIJIAN-HAO
  slot: CH6-HEAD
  when: {all: [{f: item.stem_ten_god, eq: 比肩}, {f: item.tier, eq: 向好}]}
  priority: 50
  length: [80, 120]
  polish_allowed: true
  variants:
    - "这一年天干是比肩，评分“向好”。比肩代表与你同类的人和自身的主见，今年它带来的多是助力：朋友、同行愿意搭把手，你也更有底气推动自己想做的事。适合扩大圈子、找搭档，把一个人的计划变成几个人的行动。"
    - "比肩之年，焦点在“我”和“我们”。评分为“向好”，自主性提升，身边能互相支持的人也多起来。可以把搁置已久的个人计划重新拿出来，同时多和同行交流，好的合作机会常在这些往来中出现。"
  status: draft
  author: mingli-expert
  reviewer: null
  updated: 2026-10-29

- id: CH6-HEAD-BIJIAN-PING
  slot: CH6-HEAD
  when: {all: [{f: item.stem_ten_god, eq: 比肩}, {f: item.tier, eq: 平稳}]}
  priority: 50
  length: [80, 120]
  polish_allowed: true
  variants:
    - "这一年天干是比肩，评分“平稳”。同类力量出现，但不偏帮也不添乱：独立处理事情的能力在线，人际上有往来也有比较。适合按自己的节奏推进既定计划，不必刻意求变，把手上的事情做扎实就是今年的收获。"
    - "比肩主事、评分平稳的一年，好比在熟悉的路上走：方向清楚，没有大的顺风也没有大的逆风。适合巩固自己的专业和圈子，处理好与同事、朋友之间的分工，让独立和合作保持平衡。"
  status: draft
  author: mingli-expert
  reviewer: null
  updated: 2026-10-29

- id: CH6-HEAD-BIJIAN-WEN
  slot: CH6-HEAD
  when: {all: [{f: item.stem_ten_god, eq: 比肩}, {f: item.tier, eq: 宜稳守}]}
  priority: 50
  length: [80, 120]
  polish_allowed: true
  variants:
    - "这一年天干是比肩，评分“宜稳守”。比肩在今年更像竞争者而非帮手：同类增多，资源要分，意见也容易相左。适合守住自己的阵地，合作先把分工和规则说清楚，不急于和人比高低，把力气留给自己能掌控的事。"
    - "比肩之年评分“宜稳守”，提示你留意人多事杂。身边争着做同一件事的人可能变多，自己的主见也容易变得固执。把精力放在自己能掌控的部分，遇到分歧先求共识、再谈推进，会更省力。"
  status: draft
  author: mingli-expert
  reviewer: null
  updated: 2026-10-29

- id: CH6-HEAD-BIJIAN-BAO
  slot: CH6-HEAD
  when: {all: [{f: item.stem_ten_god, eq: 比肩}, {f: item.tier, eq: 宜保守、打基础}]}
  priority: 50
  length: [80, 120]
  polish_allowed: true
  variants:
    - "这一年天干是比肩，评分落在“宜保守、打基础”。同类力量过旺，竞争和摩擦相对多，不是扩张的好时机。适合沉下心修炼基本功、梳理人际关系，合伙或共同出钱的事情尽量缓一缓，等形势明朗再说。"
    - "比肩当头而评分偏低的一年，重点是守和养。外部的比较和竞争会让人想证明自己，但今年更值得做的是练内功：提升技能、整理计划、减少不必要的应酬。根基打牢了，后面的好年份才接得住。"
  status: draft
  author: mingli-expert
  reviewer: null
  updated: 2026-10-29

# ---------- 劫财 ----------
