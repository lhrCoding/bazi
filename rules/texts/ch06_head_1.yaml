# ---------- 偏财 ----------
- id: CH6-HEAD-PIANCAI-SHUN
  slot: CH6-HEAD
  when: {all: [{f: item.stem_ten_god, eq: 偏财}, {f: item.tier, eq: 顺势期}]}
  priority: 50
  length: [80, 120]
  polish_allowed: true
  variants:
    - "这一年天干是偏财，评分“顺势期”。偏财代表灵活的机会、额外的收入来源和广泛的人脉，今年它与你相合：商务往来顺畅，新渠道容易打开。适合拓展业务、尝试新的收入方式，好机会来时可以果断一些。"
    - "偏财之年，机会多、流动快。今年评分处在“顺势期”，人缘好，整合资源的能力也强，适合谈合作、做推广、开拓新市场。手头宽裕时记得留出储备，让一时的好运变成长久的积累。"
  status: draft
  author: mingli-expert
  reviewer: null
  updated: 2026-10-29

- id: CH6-HEAD-PIANCAI-HAO
  slot: CH6-HEAD
  when: {all: [{f: item.stem_ten_god, eq: 偏财}, {f: item.tier, eq: 向好}]}
  priority: 50
  length: [80, 120]
  polish_allowed: true
  variants:
    - "这一年天干是偏财，评分“向好”。社交与商务机会增多，额外的收入来源可能出现。适合多参加行业活动、维护客户关系，对新机会保持开放，但每一笔都先算清付出和回报，再决定要不要做。"
    - "偏财主事、评分向好的一年，适合广结善缘。你更容易遇到愿意合作的人，也更擅长把资源串起来。把握机会的同时，给自己设一个支出上限，热闹之中保持清醒，收获才留得住。"
  status: draft
  author: mingli-expert
  reviewer: null
  updated: 2026-10-29

- id: CH6-HEAD-PIANCAI-PING
  slot: CH6-HEAD
  when: {all: [{f: item.stem_ten_god, eq: 偏财}, {f: item.tier, eq: 平稳}]}
  priority: 50
  length: [80, 120]
  polish_allowed: true
  variants:
    - "这一年天干是偏财，评分“平稳”。机会时有出现，但不必每个都抓，挑和自己专长相关的去做就好。适合维持主要收入，适度尝试小规模的新项目；人情往来量力而行，账目随时理清楚。"
    - "偏财之年评分平稳，进出都不算大起大落。适合把注意力放在提高效率和优化开支上，人脉可以拓展，但不必为了应酬透支时间和精力。年底回头看钱花在了哪里、哪些往来真正有价值，心里会更有数。"
  status: draft
  author: mingli-expert
  reviewer: null
  updated: 2026-10-29

- id: CH6-HEAD-PIANCAI-WEN
  slot: CH6-HEAD
  when: {all: [{f: item.stem_ten_god, eq: 偏财}, {f: item.tier, eq: 宜稳守}]}
  priority: 50
  length: [80, 120]
  polish_allowed: true
  variants:
    - "这一年天干是偏财，评分“宜稳守”。看似机会多，实际不少是来得快、去得也快。适合守住稳定收入，对快钱和陌生人的合作邀约多做核实，大额开支先放一放，等看清楚再决定。"
    - "偏财之年评分“宜稳守”，提醒你防贪多。诱惑和应酬增多，容易花得多、收得少。凡是听起来过于轻松的赚钱机会都多问几句，钱物往来留好凭据，就能把损耗降到最低。"
  status: draft
  author: mingli-expert
  reviewer: null
  updated: 2026-10-29

- id: CH6-HEAD-PIANCAI-BAO
  slot: CH6-HEAD
  when: {all: [{f: item.stem_ten_god, eq: 偏财}, {f: item.tier, eq: 宜保守、打基础}]}
  priority: 50
  length: [80, 120]
  polish_allowed: true
  variants:
    - "这一年天干是偏财，评分落在“宜保守、打基础”。收支上波动的可能性偏大，不宜冒进，不宜为别人的财务承担责任，也不宜被高回报的说法打动。适合精简开支、积累储备，把精力放在提升赚钱能力本身。"
    - "偏财当头而评分偏低的一年，宜守财不宜求财。外面的机会看着热闹，却未必适合你。今年适合理清收支、减少不必要的应酬，把时间花在能长期增值的技能上，为下一个好年份做准备。"
  status: draft
  author: mingli-expert
  reviewer: null
  updated: 2026-10-29
