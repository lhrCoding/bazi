# 第 5 章「十年大运」（第 2 批 B2，草稿）
# 槽位：CH5-INTRO（有无时辰 2）、CH5-PAST（已过大运多数组 3，非必需）、CH5-STEP（天干十神 10 × tier 5，循环：当前 + 下一步）、
#       CH5-REL（大运支冲日支 / 冲月支 / 合日支，非必需）、CH5-TRANSITION（换运年在未来 3 年内，非必需）、CH5-FAR（更远大运多数组 3）。
# 写法约定：
#   - CH5-STEP = 十神主线段 + 档位走势段（同一槽位内只有一半相同，L10 Jaccard 约 0.33）；同时用于当前步与下一步，不写“现在 / 今后”。
#   - 年份、干支只经占位符出现；“大运”后不加括号（术语自动加注）；起运年龄由依据行给出，正文不写。
#   - 档位只讲节奏与建议，不写吉凶；“交运”写过渡期，不写“交运凶”。

# ======================= CH5-INTRO =======================
- id: CH5-INTRO-HOUR
  slot: CH5-INTRO
  when: {all: [{f: profile.time_known, eq: true}]}
  asserts: []
  priority: 50
  length: [80, 120]
  polish_allowed: false
  variants:
    - "大运是传统命理中以十年为一步划分的人生阶段，每一步由一组干支代表，影响这十年的主线与节奏。下面先看已经走过的几步，再细看当前与下一步，最后简述更远的阶段，帮助你把握整体节奏。"
    - "命理里把人生按十年分成一步步的大运，每一步都有自己的主题和走势。本章按时间顺序展开：已过的大运合在一起回顾，当前与下一步重点解读，更远的阶段只做概括，方便你从整体上把握人生的节奏。"
  status: draft
  author: claude
  reviewer: null
  updated: 2026-11-13

- id: CH5-INTRO-NOHOUR
  slot: CH5-INTRO
  when: {all: [{f: profile.time_known, eq: false}]}
  asserts: []
  priority: 50
  length: [80, 120]
  polish_allowed: false
  variants:
    - "大运以十年为一步，描述人生不同阶段的主线与节奏。由于没有提供具体时辰，起运年龄只能估算，误差约四个月，换运的具体年份可能前后相差一年左右，阅读时请留一点余地，整体走势仍有参考价值。"
    - "命理里用大运把人生分成一个个十年的阶段。你没有提供具体时辰，所以起运年龄是估算值，可能与实际相差几个月，涉及换运的年份请当作大致参考，整体趋势仍然可以参照，不必过于纠结具体年份。"
  status: draft
  author: claude
  reviewer: null
  updated: 2026-11-13

- id: CH5-INTRO-FALLBACK
  slot: CH5-INTRO
  when: {}
  asserts: []
  priority: 0
  fallback: true
  length: [20, 80]
  polish_allowed: false
  variants:
    - "大运以十年为一步，下面按时间顺序介绍你的各步大运。"
  status: draft
  author: claude
  reviewer: null
  updated: 2026-11-13

# ======================= CH5-PAST 已过大运合述（非必需） =======================
- id: CH5-PAST-HAO
  slot: CH5-PAST
  when: {all: [{f: dayun_summary.past_group, eq: 好}]}
  asserts: []
  priority: 50
  length: [100, 180]
  polish_allowed: true
  variants:
    - "回头看已经走过的几步大运，整体以助力为主，属于比较顺的阶段。那几年里，你可能更容易得到机会、获得支持，也积累了不少经验和资源。这些既是过去的成果，也是你面对之后各个阶段时最可靠的底气，值得好好珍惜和延续，也提醒你继续保持当时那份积极。"
    - "已经走过的大运大多落在顺势或向好的区间。回想那段时间，或许有过不少水到渠成的经历，或者遇到了关键的人和机会。这份积累会一直跟着你，在后面节奏变化的时候，帮你更从容地应对。顺的时候学到的经验，换个阶段同样用得上。"
  status: draft
  author: claude
  reviewer: null
  updated: 2026-11-13

- id: CH5-PAST-PING
  slot: CH5-PAST
  when: {all: [{f: dayun_summary.past_group, eq: 平}]}
  asserts: []
  priority: 50
  length: [100, 180]
  polish_allowed: true
  variants:
    - "回头看已经走过的几步大运，整体比较平稳，没有特别大的起落。这样的阶段往往在不知不觉中打下了基础：学到的本事、养成的习惯、结下的关系，都在悄悄为后面的发展做准备，只是当时未必察觉。平淡的日子，往往藏着最扎实的成长。"
    - "已经走过的大运大多属于平稳的区间。那段时间也许平淡，却是积累的好时候：很多能力和认知，正是在没有大风大浪的日子里慢慢长出来的，它们会在之后的阶段逐渐显出价值。回头看，你会发现那段时间并没有白过，它让你的根基更稳。"
  status: draft
  author: claude
  reviewer: null
  updated: 2026-11-13

- id: CH5-PAST-SHOU
  slot: CH5-PAST
  when: {all: [{f: dayun_summary.past_group, eq: 守}]}
  asserts: []
  priority: 50
  length: [100, 180]
  polish_allowed: true
  variants:
    - "回头看已经走过的几步大运，整体以稳守为主，可能经历过一些需要咬牙坚持的时候。那些不太顺的日子，往往也是磨练心性、学会取舍的阶段。能走到现在，本身就说明你具备相当的韧性，这份韧性会一直是你的财富，在之后的阶段继续支撑你。"
    - "已经走过的大运大多落在宜稳守的区间，或许有过不少需要靠自己扛过去的时刻。回头看，那些经历让你更了解自己，也更清楚什么才是真正重要的。这些体会会帮你在后面的阶段走得更稳、更有方向。经历过不容易的人，更懂得珍惜顺利的时刻。"
  status: draft
  author: claude
  reviewer: null
  updated: 2026-11-13

# ======================= CH5-STEP 当前步 / 下一步（循环） =======================
- id: CH5-STEP-BIJIAN-SHUNSHI
  slot: CH5-STEP
  when: {all: [{f: item.stem_ten_god, eq: 比肩}, {f: item.tier, eq: 顺势期}]}
  asserts: []
  priority: 50
  length: [200, 300]
  polish_allowed: true
  variants:
    - "这步{item.ganzhi}大运从{item.start_year}年走到{item.end_year}年，天干是比肩。比肩主事的十年，主线是“自立”：你会更想按自己的方式做事，独立负责一摊事、建立自己的圈子，同伴和朋友的分量也会明显上升。这段时间，你的主见会帮你开出属于自己的路。从整体走势看，这步运落在“顺势期”，外部环境与你的需要比较合拍。可以把重要的计划放在这十年推进，主动争取机会、扩大投入，努力往往能得到成比例甚至超出预期的回报。顺势的时候，更要看清方向，让每一分努力都落在实处。"
    - "{item.start_year}年到{item.end_year}年是{item.ganzhi}大运，天干为比肩。这十年里，“自己做主”会成为反复出现的主题：独立门户、自己带项目、与志同道合的人结伴，都是常见的走向，个人的意志和选择会被放到更前面。你会更清楚自己想要什么，也更愿意为之负责。这十年整体属于“顺势期”，是一段适合大步向前的时间。看准的方向不妨坚定推进，该争取的位置、该开启的事业，放在这时去做阻力相对小；顺的时候也记得留一些积累，为后面的阶段打底。把握住这段窗口期，你会走得比预想的更远。"
  status: draft
  author: claude
  reviewer: null
  updated: 2026-11-13

- id: CH5-STEP-BIJIAN-XIANGHAO
