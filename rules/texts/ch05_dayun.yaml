  updated: 2026-11-13

- id: CH5-STEP-SHISHEN-SHUNSHI
  slot: CH5-STEP
  when: {all: [{f: item.stem_ten_god, eq: 食神}, {f: item.tier, eq: 顺势期}]}
  asserts: []
  priority: 50
  length: [200, 300]
  polish_allowed: true
  variants:
    - "这步{item.ganzhi}大运从{item.start_year}年走到{item.end_year}年，天干是食神。食神主事的十年，主线是“享受与创造”：生活品质、兴趣爱好、手艺和作品会变得更重要，你更愿意按自己的节奏做喜爱的事。把爱好做出名堂，往往就在这段时间。从整体走势看，这步运落在“顺势期”，外部环境与你的需要比较合拍。可以把重要的计划放在这十年推进，主动争取机会、扩大投入，努力往往能得到成比例甚至超出预期的回报。顺势的时候，更要看清方向，让每一分努力都落在实处。"
    - "{item.start_year}年到{item.end_year}年是{item.ganzhi}大运，天干为食神。这十年的关键词是从容和产出：适合把擅长的东西做成作品，把兴趣发展成能力，心态上也会比以往松弛一些，更懂得照顾自己的感受。你的品味和手艺，会在这十年里慢慢被更多人认可。这十年整体属于“顺势期”，是一段适合大步向前的时间。看准的方向不妨坚定推进，该争取的位置、该开启的事业，放在这时去做阻力相对小；顺的时候也记得留一些积累，为后面的阶段打底。把握住这段窗口期，你会走得比预想的更远。"
  status: draft
  author: claude
  reviewer: null
  updated: 2026-11-13

