    - "{item.start_year}年到{item.end_year}年是{item.ganzhi}大运，天干为偏印。这十年内心世界会变得更丰富，适合学习冷门技能、做研究、找到属于自己的专长；思考多了，行动上要注意别一直停在“想”的阶段。给自己一些安静的时间，答案往往在钻研中出现。这十年整体建议“稳守”。这并不意味着停下来，而是换一种节奏：控制风险，量力而行，优先打磨能力和关系；遇到看起来很诱人的机会，先算清楚代价再决定，稳中求进往往比冒进更有收获。把基础守牢，等节奏转换时，你会比别人准备得更充分。"
