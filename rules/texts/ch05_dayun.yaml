    - "{item.start_year}年到{item.end_year}年是{item.ganzhi}大运，天干为偏印。这十年内心世界会变得更丰富，适合学习冷门技能、做研究、找到属于自己的专长；思考多了，行动上要注意别一直停在“想”的阶段。给自己一些安静的时间，答案往往在钻研中出现。这十年整体趋势“向好”，大方向上是在往前走的。可以有计划地扩展自己的事业和生活版图，多尝试、多积累；遇到小的波折不必过度担心，保持节奏，整体会朝着好的方向发展。一步一个脚印，向好的势头会越积越明显。"
