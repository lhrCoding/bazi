    - "{item.start_year}年到{item.end_year}年是{item.ganzhi}大运，天干为比肩。这十年里，“自己做主”会成为反复出现的主题：独立门户、自己带项目、与志同道合的人结伴，都是常见的走向，个人的意志和选择会被放到更前面。你会更清楚自己想要什么，也更愿意为之负责。这十年整体走势“平稳”，节奏不快不慢。与其期待外部的大机会，不如把精力放在可控的事情上：提升专业、照顾家庭和健康、把手头的事做扎实，稳定的积累会在下一个阶段转化为底气。不慌不忙地经营，就是这段时间最好的策略。"
