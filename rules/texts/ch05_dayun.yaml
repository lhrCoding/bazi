    - "这步{item.ganzhi}大运从{item.start_year}年走到{item.end_year}年，天干是伤官。伤官主事的十年，主线是“表达与突破”：你的想法更多、更敢说，也更想打破旧框架，技能、作品和个人表达会成为发展的抓手。用作品说话，会比用言语争辩更有力量。从整体走势看，这步运宜“稳守”，外部条件不一定都顺着你，推进起来可能多费些力气。适合守住已有的成果，重要决定多做准备、多留余地，不急于大幅扩张，把精力放在巩固基础上会更稳妥。守得住，本身就是一种能力。"
    - "{item.start_year}年到{item.end_year}年是{item.ganzhi}大运，天干为伤官。这十年创造力和表达欲都会被放大，适合在专业技能、内容、技术上做出自己的东西；同时对规则的不耐烦也可能增加，需要多花心思处理与上级、制度的关系。把锋芒用在作品上，你的名字会被更多人记住。这十年整体建议“稳守”。这并不意味着停下来，而是换一种节奏：控制风险，量力而行，优先打磨能力和关系；遇到看起来很诱人的机会，先算清楚代价再决定，稳中求进往往比冒进更有收获。把基础守牢，等节奏转换时，你会比别人准备得更充分。"
  status: draft
  author: claude
  reviewer: null
  updated: 2026-11-13

- id: CH5-STEP-SHANGGUAN-BAOSHOU
  slot: CH5-STEP
  when: {all: [{f: item.stem_ten_god, eq: 伤官}, {f: item.tier, eq: 宜保守、打基础}]}
  asserts: []
  priority: 50
  length: [200, 300]
  polish_allowed: true
  variants:
    - "这步{item.ganzhi}大运从{item.start_year}年走到{item.end_year}年，天干是伤官。伤官主事的十年，主线是“表达与突破”：你的想法更多、更敢说，也更想打破旧框架，技能、作品和个人表达会成为发展的抓手。用作品说话，会比用言语争辩更有力量。从整体走势看，这步运的建议是“宜保守、打基础”。外部助力相对少，更适合向内用力：学习、积累、调养身体、整理生活与财务，为下一个阶段做准备。少做高风险的决定，打好的基础会在后面派上用场。慢一点没关系，重要的是方向对、基础牢。"
    - "{item.start_year}年到{item.end_year}年是{item.ganzhi}大运，天干为伤官。这十年创造力和表达欲都会被放大，适合在专业技能、内容、技术上做出自己的东西；同时对规则的不耐烦也可能增加，需要多花心思处理与上级、制度的关系。把锋芒用在作品上，你的名字会被更多人记住。这十年整体建议“宜保守、打基础”，是一段适合沉淀的时间。把目标放得务实一些，重心放在能力、健康和关系的长期经营上；不必和别人比速度，稳稳走完这一步，后面的路会更好走。沉下心来积累，这段时间并不会白白度过。"
  status: draft
  author: claude
  reviewer: null
  updated: 2026-11-13

- id: CH5-STEP-PIANCAI-SHUNSHI
  slot: CH5-STEP
  when: {all: [{f: item.stem_ten_god, eq: 偏财}, {f: item.tier, eq: 顺势期}]}
  asserts: []
  priority: 50
  length: [200, 300]
  polish_allowed: true
  variants:
    - "这步{item.ganzhi}大运从{item.start_year}年走到{item.end_year}年，天干是偏财。偏财主事的十年，主线是“机会与资源”：接触的人和事变多，副业、投资、跨界合作等机会也会更常出现，眼界会被明显拓宽。懂得取舍、守住重点，机会才会真正变成收获。从整体走势看，这步运落在“顺势期”，外部环境与你的需要比较合拍。可以把重要的计划放在这十年推进，主动争取机会、扩大投入，努力往往能得到成比例甚至超出预期的回报。顺势的时候，更要看清方向，让每一分努力都落在实处。"
    - "{item.start_year}年到{item.end_year}年是{item.ganzhi}大运，天干为偏财。这十年你会更频繁地和资源、人脉打交道，商务往来与灵活的机会增多，生活也会更丰富，关键在于从众多机会里挑出真正值得投入的那几个。把精力集中在少数几件事上，回报会更可观。这十年整体属于“顺势期”，是一段适合大步向前的时间。看准的方向不妨坚定推进，该争取的位置、该开启的事业，放在这时去做阻力相对小；顺的时候也记得留一些积累，为后面的阶段打底。把握住这段窗口期，你会走得比预想的更远。"
  status: draft
  author: claude
  reviewer: null
  updated: 2026-11-13

- id: CH5-STEP-PIANCAI-XIANGHAO
