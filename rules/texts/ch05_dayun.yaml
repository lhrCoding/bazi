  polish_allowed: true
  variants:
    - "这步{item.ganzhi}大运从{item.start_year}年走到{item.end_year}年，天干是七杀。七杀主事的十年，主线是“压力与担当”：挑战和责任会明显增多，常常需要你在关键时刻顶上去，也正因如此，能力会在压力中快速成长。越过几道坎之后，你会明显感到自己的分量在增加。从整体走势看，这步运落在“顺势期”，外部环境与你的需要比较合拍。可以把重要的计划放在这十年推进，主动争取机会、扩大投入，努力往往能得到成比例甚至超出预期的回报。顺势的时候，更要看清方向，让每一分努力都落在实处。"
    - "{item.start_year}年到{item.end_year}年是{item.ganzhi}大运，天干为七杀。这十年你会遇到更多需要攻坚的事情：升级的目标、更高的要求、竞争更激烈的环境，扛住了往往就是一次明显的跃升，节奏和身体都需要用心管理。能扛事的人，往往在这样的十年里被委以重任。这十年整体属于“顺势期”，是一段适合大步向前的时间。看准的方向不妨坚定推进，该争取的位置、该开启的事业，放在这时去做阻力相对小；顺的时候也记得留一些积累，为后面的阶段打底。把握住这段窗口期，你会走得比预想的更远。"
