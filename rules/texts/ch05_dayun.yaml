    - "{item.start_year}年到{item.end_year}年是{item.ganzhi}大运，天干为偏印。这十年内心世界会变得更丰富，适合学习冷门技能、做研究、找到属于自己的专长；思考多了，行动上要注意别一直停在“想”的阶段。给自己一些安静的时间，答案往往在钻研中出现。这十年整体走势“平稳”，节奏不快不慢。与其期待外部的大机会，不如把精力放在可控的事情上：提升专业、照顾家庭和健康、把手头的事做扎实，稳定的积累会在下一个阶段转化为底气。不慌不忙地经营，就是这段时间最好的策略。"
