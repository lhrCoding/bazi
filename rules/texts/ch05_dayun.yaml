  variants:
    - "这步{item.ganzhi}大运从{item.start_year}年走到{item.end_year}年，天干是比肩。比肩主事的十年，主线是“自立”：你会更想按自己的方式做事，独立负责一摊事、建立自己的圈子，同伴和朋友的分量也会明显上升。这段时间，你的主见会帮你开出属于自己的路。从整体走势看，这步运评为“向好”，助力多于阻力。适合稳步推进既定目标，在擅长的方向上加一把劲；不必冒进，但该出手的时候要出手，持续投入会慢慢积累出明显的成果。好的趋势需要你主动去接住，行动比等待更重要。"
    - "{item.start_year}年到{item.end_year}年是{item.ganzhi}大运，天干为比肩。这十年里，“自己做主”会成为反复出现的主题：独立门户、自己带项目、与志同道合的人结伴，都是常见的走向，个人的意志和选择会被放到更前面。你会更清楚自己想要什么，也更愿意为之负责。这十年整体趋势“向好”，大方向上是在往前走的。可以有计划地扩展自己的事业和生活版图，多尝试、多积累；遇到小的波折不必过度担心，保持节奏，整体会朝着好的方向发展。一步一个脚印，向好的势头会越积越明显。"
