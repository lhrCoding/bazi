    - "{item.start_year}年到{item.end_year}年是{item.ganzhi}大运，天干为偏财。这十年你会更频繁地和资源、人脉打交道，商务往来与灵活的机会增多，生活也会更丰富，关键在于从众多机会里挑出真正值得投入的那几个。把精力集中在少数几件事上，回报会更可观。这十年整体趋势“向好”，大方向上是在往前走的。可以有计划地扩展自己的事业和生活版图，多尝试、多积累；遇到小的波折不必过度担心，保持节奏，整体会朝着好的方向发展。一步一个脚印，向好的势头会越积越明显。"
