  updated: 2026-11-13

- id: CH5-STEP-BIJIAN-WENSHOU
  slot: CH5-STEP
  when: {all: [{f: item.stem_ten_god, eq: 比肩}, {f: item.tier, eq: 宜稳守}]}
  asserts: []
