    - "{item.start_year}年到{item.end_year}年是{item.ganzhi}大运，天干为劫财。这十年人际往来频繁，合伙、团队、圈子里的互动会占用你不少精力，竞争意识也会被激发出来，很多事情需要和别人一起推动才能成。选对伙伴、立好规矩，是这一步的关键功课。这十年整体走势“平稳”，节奏不快不慢。与其期待外部的大机会，不如把精力放在可控的事情上：提升专业、照顾家庭和健康、把手头的事做扎实，稳定的积累会在下一个阶段转化为底气。不慌不忙地经营，就是这段时间最好的策略。"
  status: draft
  author: claude
  reviewer: null
  updated: 2026-11-13

- id: CH5-STEP-JIECAI-WENSHOU
  slot: CH5-STEP
  when: {all: [{f: item.stem_ten_god, eq: 劫财}, {f: item.tier, eq: 宜稳守}]}
  asserts: []
  priority: 50
  length: [200, 300]
  polish_allowed: true
  variants:
    - "这步{item.ganzhi}大运从{item.start_year}年走到{item.end_year}年，天干是劫财。劫财主事的十年，主线是“竞争与合作”：机会往往和别人一起争取，社交和团队的作用很大，行动节奏也会比以往更快。和谁同行、如何分工，会直接影响这十年的成色。从整体走势看，这步运宜“稳守”，外部条件不一定都顺着你，推进起来可能多费些力气。适合守住已有的成果，重要决定多做准备、多留余地，不急于大幅扩张，把精力放在巩固基础上会更稳妥。守得住，本身就是一种能力。"
    - "{item.start_year}年到{item.end_year}年是{item.ganzhi}大运，天干为劫财。这十年人际往来频繁，合伙、团队、圈子里的互动会占用你不少精力，竞争意识也会被激发出来，很多事情需要和别人一起推动才能成。选对伙伴、立好规矩，是这一步的关键功课。这十年整体建议“稳守”。这并不意味着停下来，而是换一种节奏：控制风险，量力而行，优先打磨能力和关系；遇到看起来很诱人的机会，先算清楚代价再决定，稳中求进往往比冒进更有收获。把基础守牢，等节奏转换时，你会比别人准备得更充分。"
  status: draft
  author: claude
  reviewer: null
  updated: 2026-11-13

- id: CH5-STEP-JIECAI-BAOSHOU
  slot: CH5-STEP
  when: {all: [{f: item.stem_ten_god, eq: 劫财}, {f: item.tier, eq: 宜保守、打基础}]}
  asserts: []
  priority: 50
  length: [200, 300]
  polish_allowed: true
  variants:
    - "这步{item.ganzhi}大运从{item.start_year}年走到{item.end_year}年，天干是劫财。劫财主事的十年，主线是“竞争与合作”：机会往往和别人一起争取，社交和团队的作用很大，行动节奏也会比以往更快。和谁同行、如何分工，会直接影响这十年的成色。从整体走势看，这步运的建议是“宜保守、打基础”。外部助力相对少，更适合向内用力：学习、积累、调养身体、整理生活与财务，为下一个阶段做准备。少做高风险的决定，打好的基础会在后面派上用场。慢一点没关系，重要的是方向对、基础牢。"
    - "{item.start_year}年到{item.end_year}年是{item.ganzhi}大运，天干为劫财。这十年人际往来频繁，合伙、团队、圈子里的互动会占用你不少精力，竞争意识也会被激发出来，很多事情需要和别人一起推动才能成。选对伙伴、立好规矩，是这一步的关键功课。这十年整体建议“宜保守、打基础”，是一段适合沉淀的时间。把目标放得务实一些，重心放在能力、健康和关系的长期经营上；不必和别人比速度，稳稳走完这一步，后面的路会更好走。沉下心来积累，这段时间并不会白白度过。"
  status: draft
