    - "这步{item.ganzhi}大运从{item.start_year}年走到{item.end_year}年，天干是偏印。偏印主事的十年，主线是“钻研与转向”：你会对特别的领域、技能或思想产生兴趣，愿意静下来深入研究，也可能经历方向上的调整。这时培养的独特专长，可能成为日后的立身之本。从整体走势看，这步运落在“顺势期”，外部环境与你的需要比较合拍。可以把重要的计划放在这十年推进，主动争取机会、扩大投入，努力往往能得到成比例甚至超出预期的回报。顺势的时候，更要看清方向，让每一分努力都落在实处。"
    - "{item.start_year}年到{item.end_year}年是{item.ganzhi}大运，天干为偏印。这十年内心世界会变得更丰富，适合学习冷门技能、做研究、找到属于自己的专长；思考多了，行动上要注意别一直停在“想”的阶段。给自己一些安静的时间，答案往往在钻研中出现。这十年整体属于“顺势期”，是一段适合大步向前的时间。看准的方向不妨坚定推进，该争取的位置、该开启的事业，放在这时去做阻力相对小；顺的时候也记得留一些积累，为后面的阶段打底。把握住这段窗口期，你会走得比预想的更远。"
  status: draft
