    - "本章仅供参考。缺少时辰时只能按三柱推算：帮扶力量 {strength.S_pct}%，财星 {gods.财_pct}% 是对面最重的一股，属于“财多身弱”的思路。按扶抑这一步，取{el.比劫}为用、{el.印}为喜，让同类的力量来分担繁多的事务。但这个结论对时辰很敏感，换一个时辰，强弱方向就可能翻转，请留意。"
