  priority: 70
  length: [150, 230]
  polish_allowed: true
  variants:
    - "先说明一点：你没有提供时辰，而不同时辰下旺衰结论差别较大，所以本章的喜忌仅供参考。按三柱计算，你的命局偏弱，消耗你最多的是{gods.top_yidang|名}，占 {gods.top_yidang_pct}%。扶抑这一步的思路是借印星来生扶、缓冲，再以比劫为辅：印星对应{el.印}，比劫对应{el.比劫}。若日后补上准确时辰，这一步的结论可能改变。"
    - "本章的结论请当作参考：缺少时辰时，三柱算出的结果偏弱，但代入不同时辰后，强弱方向并不稳定。仅就三柱而言，你这边的帮扶力量占 {strength.S_pct}%，对面以{gods.top_yidang|名}为首。按扶抑这一步，会取{el.印}为用、{el.比劫}为喜，用印星去接住压力或消耗。等有了时辰再排一次，才能确认这一步是否成立。"
