# ---------- 特殊格局（priority 80） ----------
- id: CH2-METHOD-CONG-CAI
  slot: CH2-METHOD
  when: {all: [{f: strength.special, eq: 从财}]}
  asserts:
    - {f: yongshen.fy_rule, eq: Y-CONG}
  priority: 80
  length: [150, 230]
  polish_allowed: true
  variants:
    - "你的命局属于特殊的“从财格”。日主{day.stem}{day.element}在四个地支里找不到本气或中气的根，年、月、时三干也没有帮手，而财星占了全盘 {gods.财_pct}%。遇到这种情况，古法不再勉强去扶一个扶不起来的日主，而是顺着最强的一方走，称为“从”。所以你的喜忌和普通偏弱命局正好相反：{el.财}为用，{el.食伤}为喜，{el.比劫}与{el.印}反而需要节制。本项目只认条件最严的“真从”，你的命局全部满足。"
    - "多数命局按“弱则扶、强则抑”取用神，你的命局是少数例外——“从财格”。判断依据有三条：日主{day.stem}在地支里没有本气、中气的根；天干没有比劫和印星；财星独占 {gods.财_pct}%。日主既然无根可依，与其逆势去扶，不如顺势而行。所以按格局，{el.财}为用，{el.食伤}为喜，帮身的{el.比劫}、{el.印}反而容易打破平衡，需要节制。"
  status: draft
  author: mingli-expert
  reviewer: null
  updated: 2026-10-29
  notes: "样板并入 B1。修订：移除《滴天髓·从象》引文（移至 CH1-QUOTE-CONG）。正文未改。从财忌比劫在前（比劫夺财）。案例 C14。"

