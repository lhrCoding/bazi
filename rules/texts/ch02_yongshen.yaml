# 第 2 章 槽位 CH2-METHOD「取用思路」（第 1 批 B1，草稿）
# 维度：yongshen.fy_rule（扶抑 6 种）+ strength.special（6 种）= 12；修饰字段 profile.confidence。
#   - 扶抑条目 priority 50；特殊格局条目 priority 80；置信“低”条目 priority 70（三柱不判从格，不会与特殊格局同时出现）。
#   - 每条 150–230 字，2 个变体；另 1 条兜底。
# 一致性约束（report-sections.md §3 第 2 章）：METHOD 只讲“扶抑（或格局）这一步”，五行一律用 {el.*} 占位符，
#   最终结论只由代码模板 CH2-SUMMARY 给出。触发 Y-SWAP / Y-TH-NEUTRAL-OVERRIDE 时，由后续槽位说明调整。
# 古籍：第 2 章只在扶抑条目上挂 1 句《滴天髓·体用》（不含任何五行喜忌暗示）；特殊格局条目不挂
#   （从格引文已放在第 1 章 CH1-QUOTE-CONG，避免同一份报告引两次同一句）。TIAOHOU / TONGGUAN / ROLE 均不挂引文，保证本章最多 1 句。

# ---------- 扶抑：偏弱 ----------
- id: CH2-METHOD-W-SHA
  slot: CH2-METHOD
  when: {all: [{f: yongshen.fy_rule, eq: Y-FY-W-SHA}]}
  asserts:
    - {f: strength.direction, eq: 偏弱}
    - {f: gods.top_yidang, eq: 官杀}
  priority: 50
  length: [150, 230]
  polish_allowed: true
  quote:
    text: "道有体用，不可以一端论也，要在扶之抑之得其宜。"
    source: "《滴天髓·体用》"
    verified: false
    edition: ""
  variants:
    - "先看扶抑。你的命局偏弱，帮扶力量只占 {strength.S_pct}%，而消耗你的几方里最重的是官杀，占 {gods.官杀_pct}%。官杀代表外部的规则、要求和压力。古法对这种结构的处理叫“杀重用印”：不和压力硬碰，而是借印星把压力转成支持——官杀生印星，印星再生你，称为“杀印相生”。在你的命局里，印星对应的五行是{el.印}。所以按扶抑这一步，{el.印}为用，{el.比劫}为喜，{el.官杀}需要节制。"
    - "扶抑是取用神的主干方法：偏弱就扶，偏旺就抑。你属于偏弱，帮扶力量占 {strength.S_pct}%；压在你身上最重的是官杀，占 {gods.官杀_pct}%。面对较重的压力，古人的思路不是硬顶，而是“化”：让印星把官杀的力量接过来，再转交给你。你命中印星对应{el.印}，和你同类的比劫对应{el.比劫}。因此扶抑这一步的结论是：{el.印}为用、{el.比劫}为喜、{el.官杀}宜节制。"
  status: draft
  author: mingli-expert
  reviewer: null
  updated: 2026-10-29
  notes: "样板并入 B1，正文未改，新增体用引文（未核对）。对应 yongshen.md Y-FY-W-SHA。若随后触发 Y-SWAP（如 C12 原局无火），由 CH2-SWAP 说明，本段措辞“按扶抑这一步”不与之冲突。"

