    - "你的命局属于特殊的“专旺格”。帮扶力量高达 {strength.S_pct}%，生于得令之月，官杀与财星都非常弱。古法遇到这种一行独旺的结构，不主张硬去压制，而是顺其旺势，并让它有地方流出去。所以按格局，与你同类的{el.比劫}为用，生扶你的{el.印}和疏导你的{el.食伤}为喜；逆着旺势去克制的{el.官杀}，以及{el.财}，需要节制。"
    - "多数身旺的命局要抑，你的命局是例外——“专旺格”：同类力量占绝对主导，帮扶合计 {strength.S_pct}%，能约束你的官杀只有 {gods.官杀_pct}%。好比洪流只能疏、不能堵。因此按格局，{el.比劫}为用；{el.印}与{el.食伤}为喜，前者顺势加持，后者把旺气引出、化为才华；{el.官杀}、{el.财}与旺势相逆，宜节制。"
