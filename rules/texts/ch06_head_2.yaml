# 第 6 章 槽位 CH6-HEAD「年度主题」第 2 部分（第 1 批 B1，草稿）
# 本文件含 正财、七杀、正官、偏印、正印 共 25 条 + 本槽位兜底。写法约定见 ch06_head_1.yaml 文件头。
# tier 代码：SHUN=顺势期、HAO=向好、PING=平稳、WEN=宜稳守、BAO=宜保守、打基础。

# ---------- 正财 ----------
- id: CH6-HEAD-ZHENGCAI-SHUN
  slot: CH6-HEAD
  when: {all: [{f: item.stem_ten_god, eq: 正财}, {f: item.tier, eq: 顺势期}]}
  priority: 50
  length: [80, 120]
  polish_allowed: true
  variants:
    - "这一年天干是正财，评分“顺势期”。正财代表踏实的收入、明确的回报和对生活的规划，今年它与你的需要相合：付出和回报比较对得上，适合争取加薪、承接稳定的业务，或为家庭和长远做规划。"
    - "正财之年，讲的是稳稳地收获。今年评分处在“顺势期”，脚踏实地的努力容易换来实在的结果。适合把收入结构理顺、建立储蓄习惯，也适合在工作上接手更重要的职责，让能力和回报同步提升。"
  status: draft
  author: mingli-expert
  reviewer: null
  updated: 2026-10-29

- id: CH6-HEAD-ZHENGCAI-HAO
  slot: CH6-HEAD
  when: {all: [{f: item.stem_ten_god, eq: 正财}, {f: item.tier, eq: 向好}]}
  priority: 50
  length: [80, 120]
  polish_allowed: true
  variants:
    - "这一年天干是正财，评分“向好”。收入与回报趋于稳定，做事有章法，计划容易落地。适合制定年度预算、提升专业以换取更好的待遇，在感情和家庭事务上也适合多一些投入和陪伴。"
    - "正财主事、评分向好的一年，适合按计划做加法。勤勉会被看见，认真经营的事情会慢慢开花结果。把目标拆成每个季度的小步，执行起来更有成就感，年底的收获也更看得见。"
  status: draft
  author: mingli-expert
  reviewer: null
  updated: 2026-10-29

- id: CH6-HEAD-ZHENGCAI-PING
  slot: CH6-HEAD
  when: {all: [{f: item.stem_ten_god, eq: 正财}, {f: item.tier, eq: 平稳}]}
  priority: 50
  length: [80, 120]
  polish_allowed: true
  variants:
    - "这一年天干是正财，评分“平稳”。收支基本平衡，工作按部就班，没有特别大的变化。适合维持现有节奏，检查一下家庭开支和储蓄安排，把日常的小事做扎实，为后面的年份打好底子。"
    - "正财之年评分平稳，像一段记账式的日子：收入稳定、花销可控。适合提升工作效率、减少无谓支出，也可以把精力分一些给家人和生活。稳定本身就是今年的收获，不必羡慕别人的快节奏。"
  status: draft
  author: mingli-expert
  reviewer: null
  updated: 2026-10-29

- id: CH6-HEAD-ZHENGCAI-WEN
  slot: CH6-HEAD
  when: {all: [{f: item.stem_ten_god, eq: 正财}, {f: item.tier, eq: 宜稳守}]}
  priority: 50
  length: [80, 120]
  polish_allowed: true
  variants:
    - "这一年天干是正财，评分“宜稳守”。正财虽代表稳定，今年却容易因为责任和开销增多而感到吃力。适合精打细算、优先保障必要支出，不轻易扩大承诺，工作上守住本分，稳中求进。"
    - "正财之年评分“宜稳守”，提醒你量入为出。家庭、工作上的花费可能比预想多，收入增长却不一定跟得上。提前列出必要开支清单，避开冲动消费，就能平稳度过这一年。"
  status: draft
  author: mingli-expert
  reviewer: null
  updated: 2026-10-29

- id: CH6-HEAD-ZHENGCAI-BAO
  slot: CH6-HEAD
  when: {all: [{f: item.stem_ten_god, eq: 正财}, {f: item.tier, eq: 宜保守、打基础}]}
  priority: 50
  length: [80, 120]
  polish_allowed: true
  variants:
    - "这一年天干是正财，评分落在“宜保守、打基础”。收支压力相对明显，不宜做大额支出或背上长期负担的决定。适合压缩开支、积累应急储备，同时提升职业技能，为收入的下一次增长做准备。"
    - "正财当头而评分偏低的一年，宜守而不宜扩。辛苦付出未必马上换来回报，这时更要稳住心态。今年适合整理收支、减少负担，把时间花在学习和积累上，等运势转好时再加码。"
  status: draft
  author: mingli-expert
  reviewer: null
  updated: 2026-10-29

# ---------- 七杀 ----------
