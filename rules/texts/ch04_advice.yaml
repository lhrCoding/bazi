# 第 4 章「适合的行业 / 颜色 / 方位 / 数字」（第 3 批 B3，草稿）
# 槽位：CH4-WHY（用神 × 第一喜神 20 种有序对）、CH4-ELEMENT（五行 5 × 用 / 喜，循环）、CH4-NOTE（固定文本）；建议表 CH4-TABLE 由代码生成。
# 写法约定：
#   - CH4-WHY = 用神段 + 喜神段 + 两者生克关系段（喜生用 / 用生喜 / 喜克用 / 用克喜）。正文写出五行字，asserts 锁定 yong 与 xi1（L6）。
#   - 只谈生活化参考，不推荐投资品种、不推荐任何物品；CH4-NOTE 按用户 2026-11-13 拍板 D3 (b)：用“声称能改运的物品”，不用禁用词。

# ======================= CH4-WHY =======================
- id: CH4-WHY-MU-HUO
  slot: CH4-WHY
  when: {all: [{f: yongshen.yong, eq: 木}, {f: yongshen.xi1, eq: 火}]}
  asserts: [{f: yongshen.yong, eq: 木}, {f: yongshen.xi1, eq: 火}]
  priority: 50
  length: [120, 180]
  polish_allowed: true
  variants:
    - "建议表以木为主线：木代表生长、舒展和条理，对你来说，多接触让人放松、有生机的环境，做需要长期积累和规划的事，就是在补用神。喜神火作为第二重助力，带来热情和说做就做的行动力。两者是相生的关系：木生火，用神的力量会自然流向喜神，先把用神补足，喜神的作用也会跟着出来。"
    - "用神是木，意味着“生长”是你需要的力量：绿色、东方、春天，以及教育、文化、设计一类需要慢慢培育的方向，都与它相应，值得长期投入。第一喜神是火，它让你多一份表达自我的勇气。木能生火，用神是源头、喜神是延伸，所以安排上以用神为主、喜神为辅，顺序不要颠倒。"
  status: draft
  author: claude
  reviewer: null
  updated: 2026-11-13

- id: CH4-WHY-MU-TU
  slot: CH4-WHY
  when: {all: [{f: yongshen.yong, eq: 木}, {f: yongshen.xi1, eq: 土}]}
  asserts: [{f: yongshen.yong, eq: 木}, {f: yongshen.xi1, eq: 土}]
  priority: 50
  length: [120, 180]
  polish_allowed: true
  variants:
    - "建议表以木为主线：木代表生长、舒展和条理，对你来说，多接触让人放松、有生机的环境，做需要长期积累和规划的事，就是在补用神。喜神土作为第二重助力，带来踏实的作风和定力。两者之间是木克土的关系，用神主导、喜神从旁调和，安排时不必在两者之间平均用力，以用神为重心即可。"
    - "用神是木，意味着“生长”是你需要的力量：绿色、东方、春天，以及教育、文化、设计一类需要慢慢培育的方向，都与它相应，值得长期投入。第一喜神是土，它让你多一份稳住局面的底气。木能克土，所以两者的分工很清楚：用神是主角，喜神是配角，在生活里多偏向用神的方向，再适度加入喜神的元素。"
  status: draft
  author: claude
  reviewer: null
  updated: 2026-11-13

