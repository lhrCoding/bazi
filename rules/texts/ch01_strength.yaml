- id: CH1-BALANCE-CONG-SHI
  slot: CH1-BALANCE
  when: {all: [{f: strength.special, eq: 从势}]}
  asserts:
    - {f: strength.direction, eq: 偏弱}
  priority: 80
  length: [150, 220]
  polish_allowed: true
  variants:
    - "你的命局帮扶力量只有 {strength.S_pct}%，日主在地支里没有本气或中气的根，天干也没有比劫、印星。与从财、从杀不同，消耗你的三方，食伤 {gods.食伤_pct}%、财星 {gods.财_pct}%、官杀 {gods.官杀_pct}%，都有分量，却没有哪一方独大。古法把这种情况叫“从势”：日主不跟从某一种力量，而是顺应整体的大势。它和普通身弱的处理方式不同，喜忌会在下一章单独说明。"
