# 第 1 章 槽位 CH1-BALANCE「力量对比」（第 1 批 B1，草稿）
# 维度：strength.direction × gods.top_yidang（2×3=6，普通条目 priority 50）；
#       另有 strength.special（6）、strength.paradox（2）专用条目，priority 80。每条 150–220 字，2 个变体；另 1 条兜底。
# 互斥性：从弱必失令（de_ling=false 且偏弱 → paradox=null）；专旺/从强必得令且偏旺 → paradox=null。故 special 与 paradox 不会同时命中。
# 本文件原为样板文件（5 条），B1 起只放 BALANCE；样板中的 CH1-DAYMASTER-YI/-WU 移至 ch01_daymaster.yaml，
# CH1-CONCLUSION-SHENRUO 移至 ch01_conclusion.yaml。
# 写法约定：BALANCE 在三柱时照常出现，正文不写“四柱”，统一写“各柱 / 命盘里的天干地支”。
#   十神组名直接写出（when 已锁定），五行一律用占位符；不写“你喜 X”之类喜忌结论（留给第 2 章）。

# ---------- 普通条目：偏弱 ----------
- id: CH1-BALANCE-W-GUANSHA
  slot: CH1-BALANCE
  when: {all: [{f: strength.direction, eq: 偏弱}, {f: gods.top_yidang, eq: 官杀}]}
  asserts: []
  priority: 50
  length: [150, 220]
  polish_allowed: true
  variants:
    - "把命盘里的天干地支按位置加权计分后，帮扶你的一方，也就是比劫和印星，合计占 {strength.S_pct}%；消耗你的一方占 {strength.yidang_pct}%，其中分量最重的是官杀，占 {gods.官杀_pct}%。官杀代表规则、要求和外部压力，是三股消耗力量里最硬的一种。所以你的结构可以概括为：压力来得多，自身的支撑相对不足。这不是坏事的预告，而是提示你更需要能把压力接住、转化的力量。"
    - "从力量对比看，你这边的帮手，比劫占 {gods.比劫_pct}%、印星占 {gods.印_pct}%，合计 {strength.S_pct}%；另一边合计 {strength.yidang_pct}%，打头的是官杀，独占 {gods.官杀_pct}%。可以想象成一场拔河：对面人更多，而且站在最前面用力的是代表规矩和考核的那一方。现实里，这类结构的人常觉得要求一直在身后追着，责任感因此很强；需要做的不是硬扛，而是找到能分担和转化压力的支持。"
  status: draft
  author: mingli-expert
  reviewer: null
  updated: 2026-10-29

- id: CH1-BALANCE-W-SHISHANG
  slot: CH1-BALANCE
  when: {all: [{f: strength.direction, eq: 偏弱}, {f: gods.top_yidang, eq: 食伤}]}
  asserts: []
  priority: 50
  length: [150, 220]
  polish_allowed: true
  variants:
    - "按位置加权计分，帮扶你的比劫和印星合计 {strength.S_pct}%，消耗你的力量合计 {strength.yidang_pct}%，其中最重的是食伤，占 {gods.食伤_pct}%。食伤是你向外输出的才华、表达和付出，它消耗你的方式不是压迫，而是往外流。所以你的结构更像一口泉眼：流出去的多，补进来的少。好处是想法和表达不缺，需要留意的是精力容易被透支；学会给自己回血，比再多做一件事更重要。"
    - "力量对比的结果是：你这一方的比劫占 {gods.比劫_pct}%、印星占 {gods.印_pct}%，合计 {strength.S_pct}%；另一方合计 {strength.yidang_pct}%，其中食伤一项就有 {gods.食伤_pct}%。食伤旺的人往往才思敏捷、有表现欲，总有新点子想去实现。但输出远多于补充时，人会像开着太多程序的手机一样掉电很快。你的结构提示的重点，是给创造力配上足够的休整和积累。这并不是要你少做，而是做的同时也要留出补给。"
  status: draft
  author: mingli-expert
  reviewer: null
  updated: 2026-10-29

- id: CH1-BALANCE-W-CAI
  slot: CH1-BALANCE
  when: {all: [{f: strength.direction, eq: 偏弱}, {f: gods.top_yidang, eq: 财}]}
  asserts: []
  priority: 50
  length: [150, 220]
  polish_allowed: true
  variants:
    - "把各柱力量加权汇总，帮扶你的比劫和印星合计 {strength.S_pct}%，消耗你的一方合计 {strength.yidang_pct}%，其中最重的是财星，占 {gods.财_pct}%。财星代表你要去掌控和经营的资源、事务与结果。古人把类似的结构叫“财多身弱”：机会和事情摆在面前很多，但要一一拿下，需要的体力和心力也多。它提示的不是缺机会，而是要量力而行，先把能驾驭的部分做好。"
    - "从力量对比看，比劫占 {gods.比劫_pct}%、印星占 {gods.印_pct}%，你这一方合计 {strength.S_pct}%；对面合计 {strength.yidang_pct}%，其中财星独占 {gods.财_pct}%。好比一个人面前摆着一大片田地，地很肥，可耕种的人手却不够。现实中这类结构的人往往务实、对机会敏感，手上的事情也总是很多；关键在于借助合作和工具扩大自己的人手，而不是一个人把所有事扛下来，这样机会才能真正变成收获。"
  status: draft
  author: mingli-expert
  reviewer: null
  updated: 2026-10-29
  notes: "“财多身弱”为古法术语；中和偏弱也可能命中本条，故写“类似的结构”，不直接给等级。"

# ---------- 普通条目：偏旺 ----------
- id: CH1-BALANCE-S-GUANSHA
  slot: CH1-BALANCE
  when: {all: [{f: strength.direction, eq: 偏旺}, {f: gods.top_yidang, eq: 官杀}]}
  asserts: []
  priority: 50
  length: [150, 220]
  polish_allowed: true
  variants:
    - "加权计分后，帮扶你的比劫和印星合计 {strength.S_pct}%，接近或超过一半，你这一方的力量是充足的；消耗你的一方合计 {strength.yidang_pct}%，其中最有分量的是官杀，占 {gods.官杀_pct}%。对偏旺的命局来说，官杀不只是压力，也是给充沛的能量立规矩、定方向的力量，好比奔马配上缰绳。你的结构里自我力量足，同时也有一定的约束在场，关键看两者能否配合得当。"
    - "你这一方的力量，比劫占 {gods.比劫_pct}%、印星占 {gods.印_pct}%，合计 {strength.S_pct}%；另一方合计 {strength.yidang_pct}%，打头的是官杀，占 {gods.官杀_pct}%。力量偏旺的人最怕的往往不是压力，而是能量没有去处。在你的命局里，代表规则和责任的官杀是对面最强的一股，这意味着你的能量有机会通过承担责任、接受考核来释放。它在喜忌里扮演什么角色，下一章会说明。"
  status: draft
  author: mingli-expert
  reviewer: null
  updated: 2026-10-29
  notes: "偏旺 + 官杀最强时，扶抑可能是 S-BI-GUAN（官杀为用）也可能是 S-YIN（官杀为闲），所以正文不说官杀有利与否。"

- id: CH1-BALANCE-S-SHISHANG
  slot: CH1-BALANCE
  when: {all: [{f: strength.direction, eq: 偏旺}, {f: gods.top_yidang, eq: 食伤}]}
  asserts: []
  priority: 50
  length: [150, 220]
  polish_allowed: true
  variants:
    - "按位置加权，帮扶你的比劫和印星合计 {strength.S_pct}%，你这一方底气充足；消耗你的一方合计 {strength.yidang_pct}%，其中最有分量的是食伤，占 {gods.食伤_pct}%。食伤是向外输出的才华与表达。对偏旺的命局来说，这是一个现成的出口：多余的能量可以顺着它变成作品、技能和影响力。你的结构里，能量和出口都在，关键是让出口保持通畅。现实中，这类结构的人往往闲不住，越有事做状态越好。"
    - "力量对比显示，比劫占 {gods.比劫_pct}%、印星占 {gods.印_pct}%，合计 {strength.S_pct}%；另一边合计 {strength.yidang_pct}%，领头的是食伤，占 {gods.食伤_pct}%。可以把它想成一座蓄满的池塘和一条泄洪的渠道：池里存量充足，而渠道正是食伤。现实中这类结构的人常常精力旺、表达欲强，适合做有产出的事情；若长期憋着不输出，反而容易烦躁。渠道通畅时，池塘既不会干涸，也不会漫出来。"
  status: draft
  author: mingli-expert
  reviewer: null
  updated: 2026-10-29

- id: CH1-BALANCE-S-CAI
  slot: CH1-BALANCE
  when: {all: [{f: strength.direction, eq: 偏旺}, {f: gods.top_yidang, eq: 财}]}
  asserts: []
  priority: 50
  length: [150, 220]
