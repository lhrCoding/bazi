    - "多数命局都在扶弱与抑强之间找平衡，你的命局却是少见的一边倒：帮扶力量只有 {strength.S_pct}%，官杀独占 {gods.官杀_pct}%，日主在地支里无根可依。古人把这种结构叫“从杀”，意思是顺着最强的力量走，而不是勉强去扶一个扶不起来的日主。现实里，这类结构的人往往在规则清晰、分工明确的体系中更能发挥；本报告只在条件全部满足时才这样判定，喜忌也会随之不同。"
  status: draft
  author: mingli-expert
  reviewer: null
