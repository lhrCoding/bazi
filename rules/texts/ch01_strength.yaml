  variants:
    - "加权计分后，帮扶你的比劫和印星合计 {strength.S_pct}%，你这一方力量充足；消耗你的一方合计 {strength.yidang_pct}%，其中最重的是财星，占 {gods.财_pct}%。财星是你能掌控和经营的资源。力量偏旺的人有力气，最需要的是值得投入的对象，而财星恰好是对面最强的一股，好比力气大的人面前正好有一片可以开垦的地。你的结构提示：把精力放在具体的经营和成果上，最容易看到回报。"
