  updated: 2026-10-29

# ---------- 得令 / 失令悖论（priority 80） ----------
- id: CH1-BALANCE-PARADOX-WEAK
  slot: CH1-BALANCE
  when: {all: [{f: strength.paradox, eq: 得令却身弱}]}
  asserts:
    - {f: strength.de_ling, eq: true}
    - {f: strength.direction, eq: 偏弱}
  priority: 80
  length: [150, 220]
  polish_allowed: true
  variants:
    - "按老口诀，你生在{month.branch}月，月令本气是{month.main_god|名}，站在你这一边，这叫“得令”，常常被直接当成身旺。但本报告把各柱的力量全部计入后发现：帮扶你的一方合计只占 {strength.S_pct}%，消耗你的一方占 {strength.yidang_pct}%，其中最重的是{gods.top_yidang|名}，占 {gods.top_yidang_pct}%。好比主场作战，但对面的人更多——所以结论是偏弱，而不是“得令就旺”。这正是本报告坚持逐项计分、而不只看口诀的原因。"
    - "你的月令是向着你的：{month.branch}月本气为{month.main_god|名}，传统上叫“得令”。不过月令只是全局的一部分。把命盘里的天干地支都算进来，帮扶力量占 {strength.S_pct}%，而以{gods.top_yidang|名}为首的消耗力量合计占 {strength.yidang_pct}%。好比家门口就有援军，可围上来的对手更多。也就是说，你的根基不差，但需要应对的事情更多，整体仍属偏弱。这正是本报告用计分、不只看口诀的原因。"
  status: draft
  author: mingli-expert
  reviewer: null
  updated: 2026-10-29
  notes: "样板并入 B1。修订：“四柱的力量”→“各柱的力量”、“年、月、日、时的天干地支”→“命盘里的天干地支”（三柱时也会命中本条）。对应 strength.md §3（C01）。"

- id: CH1-BALANCE-PARADOX-STRONG
  slot: CH1-BALANCE
  when: {all: [{f: strength.paradox, eq: 失令却身旺}]}
  asserts:
    - {f: strength.de_ling, eq: false}
    - {f: strength.direction, eq: 偏旺}
  priority: 80
  length: [150, 220]
  polish_allowed: true
  variants:
    - "按老口诀，你生在{month.branch}月，月令本气是{month.main_god|名}，不站在你这一边，这叫“失令”，常被直接当成身弱。但本报告把各柱的力量全部计入后发现：帮扶你的一方合计占 {strength.S_pct}%，其中比劫占 {gods.比劫_pct}%、印星占 {gods.印_pct}%，消耗你的一方只占 {strength.yidang_pct}%。也就是说，月令虽然不帮你，其余各柱里你的同类和印星却不少，整体反而偏旺。这正是只看月令容易看错的地方。"
    - "你的月令并不帮你：{month.branch}月本气为{month.main_god|名}，传统上叫“失令”。但旺衰不只看月令。把其余天干地支都算进来，帮扶力量占 {strength.S_pct}%，其中比劫 {gods.比劫_pct}%、印星 {gods.印_pct}%；消耗力量合计只有 {strength.yidang_pct}%。好比客场作战，但自己带的队伍人多势众，所以结论是偏旺，而不是“失令就弱”。这也说明，月令之外的天干地支同样有分量，本报告正是为此才逐项计分。"
  status: draft
  author: mingli-expert
  reviewer: null
  updated: 2026-10-29
  notes: "失令时 main_god ∈ {食伤, 财, 官杀}，“不站在你这一边”对三者都成立。"

# ---------- 特殊格局（priority 80；只在有时柱时出现） ----------
- id: CH1-BALANCE-CONG-CAI
  slot: CH1-BALANCE
  when: {all: [{f: strength.special, eq: 从财}]}
  asserts:
    - {f: strength.direction, eq: 偏弱}
    - {f: gods.top_yidang, eq: 财}
  priority: 80
  length: [150, 220]
  polish_allowed: true
  variants:
    - "你的命局力量分布非常悬殊：帮扶你的一方只占 {strength.S_pct}%，而财星一项就占了 {gods.财_pct}%。更关键的是，日主在各个地支里找不到本气或中气的根，天干也没有比劫、印星相助。按本报告的规则，这几条同时满足，才算古法所说的“从格”；你的命局属于其中的“从财”。这种情况下，日主不再按普通身弱来看待，而是顺着最强的财星走，下一章的喜忌也会因此和普通命局不同。"
    - "多数人的命局是两方力量有来有回，你的命局则是一边倒：帮扶力量只有 {strength.S_pct}%，消耗力量高达 {strength.yidang_pct}%，其中财星独占 {gods.财_pct}%。日主在地支里没有站得住的根，天干也没有帮手，这时硬去扶它，反而事倍功半。好比一叶小舟落在大河里，与其逆流硬划，不如顺流而行。古法把这种结构叫“从财”，本报告只在条件全部满足时才这样判定，喜忌也会随之不同。"
  status: draft
  author: mingli-expert
  reviewer: null
  updated: 2026-10-29
  notes: "对应 strength.md §4.1 S-CONG（只认真从）。案例 C14。"

