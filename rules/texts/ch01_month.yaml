# 第 1 章 槽位 CH1-MONTH「月令得失」（第 1 批 B1，草稿）
# 维度：day.element × month.main_god（5×5=25，全部可能出现）。每条 100–150 字，2 个变体；另 1 条兜底。
# 依据：strength.md §3 de_ling = 月支本气为比劫或印 → 得令；《子平真诠·论用神》“八字用神，专求月令”。
# 写法约定：
#   - 月令当令的五行由 when 唯一确定（如 木日主 + 官杀 → 金），正文直接写出，并用 asserts 锁定 el.<组>。
#   - 月令五行为木/火/金/水时季节也唯一确定（寅卯春、巳午夏、申酉秋、亥子冬），正文写季节时用 asserts 锁定 month.season；
#     月令为土（辰戌丑未）时季节不定，正文不写季节。
#   - 只讲“月令这一项”，不下旺衰结论；结论留给 BALANCE / CONCLUSION。三柱同样适用（不写“四柱”）。

# ---------- 木日主 ----------
- id: CH1-MONTH-MU-BIJIE
  slot: CH1-MONTH
  when: {all: [{f: day.element, eq: 木}, {f: month.main_god, eq: 比劫}]}
  asserts: [{f: el.比劫, eq: 木}, {f: month.season, eq: 春}]
  priority: 50
  length: [100, 150]
  polish_allowed: true
  variants:
    - "你是木日主，生在{month.branch}月，正是春天草木最旺的时候。月令本气{month.main_qi}与你同属木，这在古法里叫“得令”，好比在自家主场出发，底气足、恢复快。月令是判断旺衰的第一要素，所以起点上你是占优势的；不过主场优势不等于全局占优，还要看其余各柱的力量，下一段会算给你看。"
    - "日主为木，生于{month.branch}月。春季木气当令，月令本气{month.main_qi}正是你的同类，古人称为“得令”。可以把月令理解成你出生时所处的大环境：环境与你同频，做事容易得到呼应，自我恢复的能力也强。不过月令只是一个起点，全局的强弱还要把其余天干地支一起算。"
  status: draft
  author: mingli-expert
  reviewer: null
  updated: 2026-10-29

- id: CH1-MONTH-MU-YIN
  slot: CH1-MONTH
  when: {all: [{f: day.element, eq: 木}, {f: month.main_god, eq: 印}]}
  asserts: [{f: el.印, eq: 水}, {f: month.season, eq: 冬}]
  priority: 50
  length: [100, 150]
  polish_allowed: true
  variants:
    - "你是木日主，生在{month.branch}月，时值冬季，水气当令。水能生木，月令本气{month.main_qi}对你来说是印星，也算“得令”：好比冬天的树，表面安静，根下却有水在默默滋养。这种起点意味着你容易得到支持和庇护；只是冬天的木同样需要温度，命局里暖意够不够，也是后面要看的一项。"
    - "日主为木，生于{month.branch}月。冬季水旺，月令本气{month.main_qi}属水，水生木，所以这个月令是来生扶你的，古法同样算作“得令”。落到现实中，常表现为成长路上不缺照应：有人教、有人带，或者有比较安稳的家庭与学习环境。得令只说明根基不差，最终强弱还要看其余各柱。"
  status: draft
  author: mingli-expert
  reviewer: null
  updated: 2026-10-29
  notes: "只提“暖意够不够是后面要看的一项”，不承诺一定出现调候段（调候只在火 <10% 时触发）。"

- id: CH1-MONTH-MU-SHISHANG
  slot: CH1-MONTH
  when: {all: [{f: day.element, eq: 木}, {f: month.main_god, eq: 食伤}]}
  asserts: [{f: el.食伤, eq: 火}, {f: month.season, eq: 夏}]
  priority: 50
  length: [100, 150]
  polish_allowed: true
  variants:
    - "你是木日主，生在{month.branch}月，正值夏季，火气当令。木生火，月令的力量是从你身上往外流的，十神里叫食伤，古法称为“失令”：好比盛夏的树，枝叶繁茂，耗费也快。这种起点让你的表达欲、创造力出来得早，但也更容易透支，需要其他各柱来补充能量，具体多少看下一段的计分。"
    - "日主为木，生于{month.branch}月。夏天火旺，月令本气{month.main_qi}属火，是由你生出去的力量，所以不算得令。它带来的不是压力，而是消耗：才华和精力容易被调动起来，往外输出得多、回收得少。这类月令常见想法多、行动快的人，同时要留意给自己留出休整的空间。"
  status: draft
  author: mingli-expert
  reviewer: null
  updated: 2026-10-29

- id: CH1-MONTH-MU-CAI
  slot: CH1-MONTH
  when: {all: [{f: day.element, eq: 木}, {f: month.main_god, eq: 财}]}
  asserts: [{f: el.财, eq: 土}]
  priority: 50
  length: [100, 150]
  polish_allowed: true
  variants:
    - "你是木日主，生在{month.branch}月，月令本气{month.main_qi}属土。木克土，土是你要去掌控和耕耘的对象，十神里叫财星，古法称为“失令”。好比树木扎根在厚土里，土多了，树要花很大力气才能把根扎稳。这种起点让你很早接触现实事务，务实、有经营意识，但单靠月令借不上力，需要看其余各柱的支援。"
    - "日主为木，生于{month.branch}月。这是土当令的月份，月令本气{month.main_qi}属土，对你来说是财星。财星是你要去管理、经营的资源，它不来帮你，反而需要你出力去驾驭，所以不算得令。现实中常见的表现是：对结果和效率比较敏感，愿意为具体的回报付出努力；驾驭得住与否，要看下面的力量对比。"
  status: draft
  author: mingli-expert
  reviewer: null
  updated: 2026-10-29
  notes: "辰月藏乙木中气，木日主仍有根，但本条只讲月令本气，不涉及根，不冲突。"

- id: CH1-MONTH-MU-GUANSHA
  slot: CH1-MONTH
  when: {all: [{f: day.element, eq: 木}, {f: month.main_god, eq: 官杀}]}
  asserts: [{f: el.官杀, eq: 金}, {f: month.season, eq: 秋}]
  priority: 50
  length: [100, 150]
  polish_allowed: true
  variants:
    - "你是木日主，生在{month.branch}月，正值秋季，金气当令。金能克木，就像秋风让草木收敛，月令本气{month.main_qi}对你来说是官杀，古法称为“失令”。这意味着你可能比同龄人更早面对规矩、要求和比较，压力来得早，责任感也养得早。压力本身不是坏事，关键在于有没有力量把它接住，下一段会算给你看。"
    - "日主为木，生于{month.branch}月。秋季金旺，月令本气{month.main_qi}属金，金克木，所以这个月令对你是约束的力量，不算得令。可以把它想成出生时的大环境偏严格：标准高、规则多。这类起点的人往往自律、懂分寸，也更早学会在压力下做事；全局是否担得住，要看其余各柱。"
  status: draft
  author: mingli-expert
  reviewer: null
  updated: 2026-10-29

