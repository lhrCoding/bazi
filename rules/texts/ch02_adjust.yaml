# 第 2 章 修正类槽位（第 1 批 B1，草稿）：CH2-SWAP、CH2-TIAOHOU、CH2-TONGGUAN（均为非必需槽位，无兜底）
#
# CH2-SWAP：yongshen.swap=true，1 条通用条目（全部用占位符）。80–130 字。
# CH2-TIAOHOU：yongshen.th（AGREE / NEUTRAL-OVERRIDE / ADD-XI）× month.season（冬 / 夏）= 6 条。100–160 字。
#   调候五行由季节唯一决定（冬→火、夏→水），正文直接写出并用 asserts 锁定 th_element；
#   写“有利 / 用神”时再锁 favorable 或 yong。
#   NEUTRAL-OVERRIDE：yongshen.md v1.1 已明确原用神保留为第一喜神（冬删水 / 夏删土只作用于原喜神列表，案例 C20）。
#   正文仍只写“扶抑结论没有作废、排序见下面的结论”，与新规则一致，未改正文。
# CH2-NOHOUR-CONG：仅三柱；profile.time_known=false 且 strength.nohour_cong_possible=true。60–100 字，不送润色。
#   只提示“可能符合从格条件”，不判定为从格；正文用“时辰”，不用“出生时辰 / 时柱”（L7）。
# CH2-TONGGUAN：tg=true × tg_element（5）。80–130 字。
#   通关五行 Z 唯一决定相战的两方：Z 的母（攻方）克 Z 的子（受克方）。如 Z=水 ⇔ 金克木。
#   正文写出两方五行，并用 power_pct ≥25 锁定（与 yongshen.md §5 “各自 ≥ total×25%”一致）。

# ======================= CH2-SWAP =======================
- id: CH2-SWAP-GENERIC
  slot: CH2-SWAP
  when: {all: [{f: yongshen.swap, eq: true}]}
  asserts: []
  priority: 50
  length: [80, 130]
  polish_allowed: true
  variants:
    - "需要补充一点：按上一步，你最需要的是{yongshen.swap_from}，但你的原局里完全没有{yongshen.swap_from}。本报告的做法是以命中已有的{yongshen.swap_to}为用神，把{yongshen.swap_from}排在喜神第一位。这只是先后顺序的调整，方向没有变：将来遇到{yongshen.swap_from}的大运、流年，同样算对你有利的阶段。"
    - "这里有一个细节。理论上排第一的{yongshen.swap_from}，在你的原局里一点都没有。古法强调用神最好取自命中本有的力量，所以本报告把命中已有的{yongshen.swap_to}定为用神，{yongshen.swap_from}降为第一喜神。两者都是对你有利的五行，只是谁打头阵的区别；遇到{yongshen.swap_from}旺的年份，依然是助力。"
  status: draft
  author: mingli-expert
  reviewer: null
  updated: 2026-10-29
  notes: "样板并入 B1。修订：“原局四柱里”→“原局里”（三柱时也可能触发）。对应 yongshen.md §3.3 Y-SWAP（用户确认保留）。"

# ======================= CH2-TIAOHOU =======================
- id: CH2-TIAOHOU-AGREE-WINTER
  slot: CH2-TIAOHOU
  when: {all: [{f: yongshen.th, eq: AGREE}, {f: month.season, eq: 冬}]}
  asserts:
    - {f: yongshen.th_element, eq: 火}
    - {f: yongshen.favorable, contains: 火}
  priority: 50
  length: [100, 160]
  polish_allowed: true
  variants:
    - "再看季节。你生在{month.branch}月，是一年里最冷的时段，而命局里火只占 {power_pct.火}%。《穷通宝鉴》论冬天出生的命局，大多先看有没有火来暖局，这叫调候。你的扶抑结论本来就把火列为有利的五行，两条思路指向同一处，“火对你有利”这个判断因此更有把握。"
    - "从季节看，{month.branch}月天寒地冻，命局需要温度；而你的火只占 {power_pct.火}%，明显偏少。古籍把这种按冷暖做的调整叫调候，冬季命局通常以火为先。按扶抑你本来就需要火——扶抑与调候一致，是取用神时比较理想的情况；后面大运、流年遇到火旺的阶段，可以更积极地安排计划。"
  status: draft
  author: mingli-expert
  reviewer: null
  updated: 2026-10-29
  notes: "样板并入 B1，正文未改。对应 Y-TH-AGREE（冬）。案例 C01。"

- id: CH2-TIAOHOU-AGREE-SUMMER
