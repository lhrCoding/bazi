  when: {all: [{f: yongshen.th, eq: AGREE}, {f: month.season, eq: 夏}]}
  asserts:
    - {f: yongshen.th_element, eq: 水}
    - {f: yongshen.favorable, contains: 水}
  priority: 50
  length: [100, 160]
  polish_allowed: true
  variants:
    - "季节也要考虑。{month.branch}月是一年里最炎热干燥的时段，你的命局里水只有 {power_pct.水}%。古人论夏月命局，讲究先以水来降温润燥，这一步叫调候。巧的是，按扶抑你本来就需要水，两种方法得出了同一个答案。所以水在你这里既能平衡强弱，也能调节燥热，作用是双重的。"
    - "从季节看，你生于盛夏的{month.branch}月，暑气正盛，而命局中的水仅占 {power_pct.水}%，显得不够。调候讲究夏月需水，这与扶抑给出的有利五行恰好一致。两条独立的思路相互印证时，结论通常更可靠；后面遇到水旺的大运、流年，可以更主动地推进计划。"
  status: draft
  author: mingli-expert
  reviewer: null
  updated: 2026-10-29
  notes: "对应 Y-TH-AGREE（夏）。案例 C13。"

