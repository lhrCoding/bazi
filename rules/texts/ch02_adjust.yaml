# ======================= CH2-NOHOUR-CONG =======================
- id: CH2-NOHOUR-CONG-GENERIC
  slot: CH2-NOHOUR-CONG
  when: {all: [{f: profile.time_known, eq: false}, {f: strength.nohour_cong_possible, eq: true}]}
  asserts: []
  priority: 50
  length: [60, 100]
  polish_allowed: false
  variants:
    - "另需说明：如果你实际生在{strength.nohour_cong_hours}时，命局可能符合较少见的从格条件，那时喜忌会和本章大体相反。没有时辰时本报告不作这一判定，仍以上面的结论为准；能确认时辰的话，建议重新排盘核对。"
    - "还有一种可能需要告诉你：把{strength.nohour_cong_hours}时补进命盘，会满足从格的判定条件，喜忌方向随之改变。缺少时辰时本报告不判从格，所以以上内容照常参考；日后知道准确时辰，重新排一次就能确认。"
  status: draft
  author: mingli-expert
  reviewer: null
  updated: 2026-10-30
  notes: "B1 补写（用户 2026-10-30 同意新增字段）。对应 strength.md v2.1 §5 第 4 条。列表占位符按“、”连接，如“子、丑时”。措辞只说“可能符合条件”，不判从格、不改结论；“大体相反”因从儿不忌比劫，不写“完全相反”。案例 C18（no_hour.cong_possible_hours 为辛巳、丙戌 → 巳、戌）。"
