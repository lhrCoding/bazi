    L3_placeholders: "只引用 §3 字段；用到 |名 过滤器的都是十神组字段。"
    L4_wordlists: "人工对照 report-sections.md §7 禁用词表：零命中（特别排查了 灾、化解、转运、命中无、一定、凶、贵人）。疾病名零命中；未出现任何投资品种词。词表文件（K01）尚未建，待工具复查。"
