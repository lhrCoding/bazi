  open_issues:
    - id: 1
      topic: "第 1 章古籍放在哪里"
      detail: "样板把《天干论》引文挂在 DAYMASTER 上，但 CH1-QUOTE 槽位也要出引文，一章最多 1 句时会冲突。本批改为只在 CH1-QUOTE 出引文（按旺衰选），天干论留给第 3 章 CH3-BASE。"
      recommendation: "采纳本批做法"
      status: "已解决：用户 2026-10-30 同意，保持现状"
    - id: 2
      topic: "CH2-NOHOUR-CONG 缺字段"
      detail: "report-sections.md 规定“三柱且扫描有从格时辰”才出现，但 README §3 字段字典没有对应字段（strength notes 不是 ctx 字段），无法写 when。"
      recommendation: "在 report-sections.md §0 / README §3 增加 strength.nohour_cong_possible（布尔）与 strength.nohour_cong_hours（列表，地支），之后补写 1 条素材"
      status: "已解决（2026-10-30）：strength.md v2.1 §5 第 4 条写明计算方法；report-sections.md §0 与 §3、README §3.1 已加字段；补写 CH2-NOHOUR-CONG-GENERIC（2 个变体）"
    - id: 3
      topic: "Y-TH-NEUTRAL-OVERRIDE 的歧义"
      detail: "yongshen.md §4 写“原用神降为第一喜神；从喜神中删去克调候五行（冬删水、夏删土）”。若原用神本身就是水（冬）或土（夏），例如冬季中和偏弱的木日主（扶抑取水为用），是先降级后又被删掉（水变闲神），还是保留？两种读法结论不同。本批 TIAOHOU 正文已回避，不写原用神去向。"
      recommendation: "保留：删除只作用于原喜神列表，被降级的原用神不删（扶抑主干不应被调候整个抹掉）；需改 yongshen.md 并补 1 个案例"
      status: "已解决（2026-10-30）：yongshen.md v1.1 §4 改写并写明执行顺序；cases.json 新增 C20（1981-12-22 20:00 男，辛酉 庚子 甲戌 甲戌，用火、喜水木、忌金土；人工推算，起运字段待 T21 代码复核）。C16 结果不变"
    - id: 4
      topic: "CH6-REL 的触发写法"
      detail: "item.relations 是对象列表，本批写成 {f: item.relations, contains: {type: 冲, a: 流年支, b: 日支}}。README §4.1 的 contains 只写了“列表包含某值”，需要求值器支持对象按字段全等匹配；或在 ctx 中另给扁平字段（如 item.rel_tags: [冲日支, 合日支]）。"
      recommendation: "开发 T23 时支持对象全等 contains；若改扁平字段，本批 4 条只需改 when"
    - id: 5
      topic: "L6 是否把 when 中的锁定视同 asserts"
      detail: "CH1-MONTH 正文写“你是木日主”，木由 when（day.element eq 木）锁定，asserts 只锁了月令五行。"
      recommendation: "lint 把 when 中的 eq 叶子视同锁定（语义上 when 成立即保证该事实）；否则本批需给 25 条 MONTH 补一行 asserts"
    - id: 6
      topic: "变体顺延与哈希公式不一致"
      detail: "README §5.2 说同一条目第二次命中“自动换到下一个变体”，但公式 idx = SHA256(...|occurrence) mod n 只是重新取模，2 个变体时有 50% 概率仍是同一个。CH6 四领域、DO、WATCH 在 5 年里同组十神通常出现两次，会直接受影响。"
      recommendation: "改为 idx = (h0 + occurrence) mod n（h0 为 occurrence=0 时的哈希）"
      status: "用户决定不改（2026-10-30）：保留 SHA256(...|occurrence) mod n；README §5.2 与 report-sections.md 第 6 章说明已改为“重新哈希、可能与上次相同”。后续可给 CH6 四领域 / DO / WATCH 等高频条目追加第 3 个变体降低重复概率"
    - id: 7
      topic: "CH2-ROLE-XI / -JI 只能写第一项"
      detail: "report-sections.md 写“喜 1–2、忌 1–2”，但字段只有 xi1_god / ji1_god。本批每槽位选 1 条，完整列表用 {yongshen.xi} / {yongshen.ji} 带出。"
      recommendation: "若要写第二条，需新增 xi2_god / ji2_god 字段与第二个循环 item；MVP 可不做"
      status: "暂按本批做法（只写第一项），待用户复核"
    - id: 8
