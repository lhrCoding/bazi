    L6_wuxing_window: "正文直接写出的五行字都已锁定：DAYMASTER 锁 day.element；MONTH 锁 el.<组> 与 season；TIAOHOU 锁 th_element 与 favorable/yong；TONGGUAN 锁 favorable 与两方 power_pct。主动避开含五行字的日常词（资金、金钱、薪水、水平、温水、泥土、水渠等），并把样板中的“水满了就开渠”改为“池子满了就开渠”。注意：MONTH 正文中的日主五行字由 when（day.element）锁定而未在 asserts 重复，若 L6 只认 asserts，需要补上或让 lint 把 when 中的 eq 视同锁定（见 open_issues #5）。"
    L7_hour_terms: "只有 CH6-REL-CHONG-SHIZHI 含“时支”，已标 requires_hour。无时辰条目一律只用“时辰”，不用“出生时辰”。"
    L8_length_variants: "非兜底条目均 2 个变体，兜底 1 个。BALANCE 有 16 处变体自估低于 150 字，已补写到区间内；其余按估算在区间内。兜底条目的 length 比槽位区间短（与样板 BALANCE 兜底一致）。"
    L9_basis_brackets: "正文无“依据：”；全库不使用全角括号。"
    L10_similarity: "同槽位条目刻意避免共用句架（如 TONGGUAN 5 条各用不同意象，NOHOUR 偏弱/偏旺两组改写句式）。风险点：CH1-CONCLUSION 的 BL-* 与 NOHOUR-* 内部句式相近，CH6 四领域短句共用“事业上 / 财务上”开头，需工具实测。"
    L11_approved: "全部为 draft；全部引文 verified=false、edition 为空（draft 允许）。"
    L12_absolute_person: "无 一定 / 必然 / 注定 / 肯定会；全部用“你”，无“您 / 命主 / 大师”。"
    other_review_points:
      - "METHOD 一律用“按扶抑这一步 / 按格局”口径，五行用 {el.*}；最终结论只留给 SUMMARY。"
      - "身弱 / 偏弱条目没有劝“少接触帮扶自己的五行”；守档条目不乐观、好档条目不消极。"
      - "三柱可能命中的条目不写“四柱”：已修订样板 PARADOX-WEAK、SWAP-GENERIC 中的“四柱”。"
      - "感情段性别中立；健康段无病名，CH6-HEALTH 设为不送润色。"
      - "古籍：第 1 章只在 CH1-QUOTE 挂引文，第 2 章只在 6 条扶抑 METHOD 上挂同一句《滴天髓·体用》，第 6 章不引，保证一章最多 1 句。共用 4 句：《滴天髓》衰旺、中和、从象、体用，均未核对底本。"

