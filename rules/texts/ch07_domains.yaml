# 第 7 章「事业 / 财运 / 感情 / 健康」（第 2 批 B2，草稿）
# 槽位：CH7-CAREER（career.mode 5 × 旺弱 2）、CH7-CAREER-NOW（当前大运 stem_god 5 × tier_group 3，非必需）、
#       CH7-WEALTH（财的角色 4 × 财力量档 3）、CH7-LOVE（伴侣星角色 4 × 性别 2）、CH7-LOVE-YEARS（非必需，通用 1 条）、
#       CH7-HEALTH（过旺 / 过弱五行 10 + 均衡 1，不送润色）、CH7-HEALTH-END（固定文本）。
# 写法约定（report-sections.md §3 第 7 章）：
#   - 事业：官杀 → 体系内、管理岗；食伤 → 技术、内容、自主；印 → 学习、资质型；比劫 → 合作、团队、自主经营；财 → 经营、商务、运营。
#   - 财运：只谈赚钱方式倾向，不谈投资品种、不承诺收入。
#   - 感情：男命看财星、女命看官杀，对外统一叫“伴侣星”；不写克夫 / 克妻 / 离婚 / 二婚。
#   - 健康：只写对应身体系统与作息 / 饮食 / 运动建议，不出现任何疾病名；结尾固定接就医提示。
#   - CH7-LOVE-YEARS 规范按“有合 / 有冲 / 都有”分 3 条，但字段字典暂无对应字段（年份与关系由依据行列出），先写 1 条通用条目。

# ======================= CH7-CAREER =======================
- id: CH7-CAREER-GUANSHA-WANG
  slot: CH7-CAREER
  when: {all: [{f: career.mode, eq: 官杀}, {f: strength.direction, eq: 偏旺}]}
  asserts: []
  priority: 50
  length: [200, 300]
  polish_allowed: true
  variants:
    - "事业上，对你最有帮助的是官杀这股力量。它代表规则、平台和责任，所以你更适合在体系清楚的环境里发展，比如机关事业单位、大型企业，或走管理、带团队的路线；职位与信誉是你积累的重点。在这样的环境里，稳定的规则会成为你的护栏，让你一步步往上走；考核、竞聘这类机会也值得认真准备。起步阶段可以先在规范的单位里打好基础，熟悉流程、积累资历；走到合适的位置，再考虑带团队或承担更大的职责。你的命局整体偏旺，精力和承受力都比较足，可以主动争取更大的舞台，承担更多责任。不过也要给团队留出空间，独揽一切反而会限制发展。在选择方向时，可以优先考虑成长空间大、对能力要求高的机会，你有足够的精力去应对挑战。"
    - "从命局看，你的事业助力来自官杀：组织、制度和职责会推着你成长。适合选择晋升路径清楚的单位，承担管理、监督、项目负责一类的角色，把守规矩和担责任变成你的竞争力。守得住规矩、扛得起责任的人，在组织里往往越走越稳，你的耐心和可靠会慢慢转化为职位和名声。如果在私营或创业环境中，也可以主动承担制度建设、质量把关一类的工作，把你的长处用在“立规矩”上。整体偏旺的你适合主动出击，敢于接挑战、带团队，往往能更快地走到前面。同时注意分配精力，别让工作挤占了全部生活。面对新机会，不妨多一些主动，你的承受力能撑起更快的发展节奏，关键是方向要选对。"
  status: draft
  author: claude
  reviewer: null
  updated: 2026-11-13

