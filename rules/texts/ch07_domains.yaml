  polish_allowed: true
  variants:
    - "财运方面，财星在你的命局里是用神对应的力量，赚钱和经营本身就能让你更顺。你适合靠实际的业务、项目和经营来增加收入，主动去争取回报，往往比被动等待更有效。当你在工作中能直接看到产出和回报时，干劲往往最足，也最容易把事情做好，收入增长和个人成长会互相推动。具体做法上，可以把一部分精力放在能直接产生收益的项目上，并定期复盘投入产出，找到最适合自己的赚钱方式。你命局中财星的力量适中，占 {gods.财_pct}%，收入节奏比较平稳，适合长期、有计划地积累。细水长流，往往走得最远。每年给自己定一个可执行的储蓄目标，坚持几年，变化会很明显。"
    - "从财运看，财星是对你最有帮助的力量之一，把精力放在能产生实际收益的事情上，会让你整体状态更好。适合多参与经营、销售、项目制的工作，用结果换回报。这类命局的人，往往在负责实际业务、直接面对结果的位置上发挥最好，越做越有信心。不妨给自己设定阶段性的收入目标，并把它和能力提升挂钩，赚钱的过程同时也是成长的过程。财星在你的命局里占 {gods.财_pct}%，力量适中，稳定积累比追求一时的高收益更适合你。守住节奏，财务会稳步改善。把收入的增长和能力的提升绑在一起，你的财务会越来越有底气。"
  status: draft
  author: claude
  reviewer: null
  updated: 2026-11-13

- id: CH7-WEALTH-YONG-RUO
  slot: CH7-WEALTH
  when: {all: [{f: wealth.role, eq: 用}, {f: wealth.level, eq: 弱}]}
  asserts: []
  priority: 50
  length: [200, 300]
  polish_allowed: true
  variants:
    - "财运方面，财星在你的命局里是用神对应的力量，赚钱和经营本身就能让你更顺。你适合靠实际的业务、项目和经营来增加收入，主动去争取回报，往往比被动等待更有效。当你在工作中能直接看到产出和回报时，干劲往往最足，也最容易把事情做好，收入增长和个人成长会互相推动。具体做法上，可以把一部分精力放在能直接产生收益的项目上，并定期复盘投入产出，找到最适合自己的赚钱方式。你命局中财星的力量较弱，占 {gods.财_pct}%，钱更多是一点点攒出来的，耐心和稳健比什么都重要。慢一点没关系，稳才是关键。先把基本生活和应急储备安排好，再考虑其他用途，心里会更踏实。"
    - "从财运看，财星是对你最有帮助的力量之一，把精力放在能产生实际收益的事情上，会让你整体状态更好。适合多参与经营、销售、项目制的工作，用结果换回报。这类命局的人，往往在负责实际业务、直接面对结果的位置上发挥最好，越做越有信心。不妨给自己设定阶段性的收入目标，并把它和能力提升挂钩，赚钱的过程同时也是成长的过程。财星在你的命局里只占 {gods.财_pct}%，财来得相对慢，适合用稳定的工作和储蓄打底，不碰看不懂的机会。积少成多，时间会给你回报。提升专业能力是增加收入最可靠的办法，比寄望于运气要稳得多。"
  status: draft
  author: claude
  reviewer: null
  updated: 2026-11-13

- id: CH7-WEALTH-XI-QIANG
  slot: CH7-WEALTH
  when: {all: [{f: wealth.role, eq: 喜}, {f: wealth.level, eq: 强}]}
  asserts: []
  priority: 50
  length: [200, 300]
  polish_allowed: true
  variants:
    - "财运方面，财星在你的命局里属于有利的一方，经营和理财对你是加分项。稳定的工作收入之外，可以发展一项与专长相关的副业，让收入来源更多元。理财上以稳为主，先建立应急储备，再考虑其他安排，会让你在面对变化时更从容。具体做法上，可以先把收入的一部分固定存起来，再根据兴趣和专长发展一项小副业，让财务结构更稳。你命局中财星的力量较强，占 {gods.财_pct}%，平时经手的钱和事务都不少，养成记账和预算的习惯会很有帮助。钱进来容易，留下来要靠规划。同时适当分散精力，不必把所有机会都揽在身上，留出余力应对变化。"
    - "从财运看，财星对你是有帮助的，适度关注收入结构和长期规划，会让生活更有底气。踏实工作、量入为出，再加上一点经营意识，财务会稳步改善。把每一份收入合理分配到生活、储蓄和自我提升上，长期下来会看到明显的积累。日常可以养成记账的习惯，了解钱花在了哪里，再据此调整，财务会越来越清晰。财星在你的命局里占 {gods.财_pct}%，力量偏强，赚钱的机会通常不缺，关键在于取舍与规划。学会说“不”，也是一种理财能力。把收入的一部分固定存下来，比追逐更多机会更能带来安全感。"
  status: draft
  author: claude
  reviewer: null
  updated: 2026-11-13

