- id: CH7-CAREER-YIN-WANG
  slot: CH7-CAREER
  when: {all: [{f: career.mode, eq: 印}, {f: strength.direction, eq: 偏旺}]}
  asserts: []
  priority: 50
  length: [200, 300]
  polish_allowed: true
  variants:
    - "事业上，对你最有帮助的是印星这股力量。它代表学习、资质和支持，所以你更适合走专业路线：需要证书和积累的行业、研究与教育、咨询顾问等，越学越值钱，平台和前辈的提携也很重要。不要吝惜在学习上的投入，资历和证书会在关键时刻替你说话，遇到好老师、好平台也要懂得珍惜。起步阶段可以先选定一个专业领域，系统学习、考取关键资质；之后在平台的支持下逐步积累经验和名望。你的命局整体偏旺，精力和承受力都比较足，可以主动争取更大的舞台，承担更多责任。不过也要给团队留出空间，独揽一切反而会限制发展。在选择方向时，可以优先考虑成长空间大、对能力要求高的机会，你有足够的精力去应对挑战。"
    - "从命局看，你的事业助力来自印星：知识、资质和贵人的帮助是你的底牌。适合学习型、资质型的职业道路，比如专业技术、教育科研、医药健康服务、法务财务等，持续进修会让你越来越有分量。把时间花在能长期增值的知识和资质上，你会发现职业道路越走越宽，回报也越来越稳定。如果条件允许，进修或在职深造会是很值得的投资；跟着行业里口碑好的前辈做事，成长会快很多。整体偏旺的你适合主动出击，敢于接挑战、带团队，往往能更快地走到前面。同时注意分配精力，别让工作挤占了全部生活。面对新机会，不妨多一些主动，你的承受力能撑起更快的发展节奏，关键是方向要选对。"
  status: draft
