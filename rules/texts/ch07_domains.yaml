# ======================= CH7-WEALTH =======================
- id: CH7-WEALTH-YONG-QIANG
  slot: CH7-WEALTH
  when: {all: [{f: wealth.role, eq: 用}, {f: wealth.level, eq: 强}]}
  asserts: []
  priority: 50
  length: [200, 300]
  polish_allowed: true
  variants:
    - "财运方面，财星在你的命局里是用神对应的力量，赚钱和经营本身就能让你更顺。你适合靠实际的业务、项目和经营来增加收入，主动去争取回报，往往比被动等待更有效。当你在工作中能直接看到产出和回报时，干劲往往最足，也最容易把事情做好，收入增长和个人成长会互相推动。具体做法上，可以把一部分精力放在能直接产生收益的项目上，并定期复盘投入产出，找到最适合自己的赚钱方式。你命局中财星的力量较强，占 {gods.财_pct}%，平时经手的钱和事务都不少，养成记账和预算的习惯会很有帮助。钱进来容易，留下来要靠规划。同时适当分散精力，不必把所有机会都揽在身上，留出余力应对变化。"
    - "从财运看，财星是对你最有帮助的力量之一，把精力放在能产生实际收益的事情上，会让你整体状态更好。适合多参与经营、销售、项目制的工作，用结果换回报。这类命局的人，往往在负责实际业务、直接面对结果的位置上发挥最好，越做越有信心。不妨给自己设定阶段性的收入目标，并把它和能力提升挂钩，赚钱的过程同时也是成长的过程。财星在你的命局里占 {gods.财_pct}%，力量偏强，赚钱的机会通常不缺，关键在于取舍与规划。学会说“不”，也是一种理财能力。把收入的一部分固定存下来，比追逐更多机会更能带来安全感。"
  status: draft
  author: claude
  reviewer: null
  updated: 2026-11-13

