- id: CH7-WEALTH-JI-QIANG
  slot: CH7-WEALTH
  when: {all: [{f: wealth.role, eq: 忌}, {f: wealth.level, eq: 强}]}
  asserts: []
  priority: 50
  length: [200, 300]
  polish_allowed: true
  variants:
    - "财运方面，财星在你的命局里需要节制，钱和事务一多，反而容易让你疲于应付。比起追求快速增加收入，更适合先把支出和精力管理好，收入来源宁可少而稳。尤其是借钱给人、替人担保、合伙出资这类事，最好多想一步，留足余地，书面约定也很重要。具体做法上，大额支出和借贷前给自己一段冷静期，必要时听听家人或专业人士的意见，再做决定。你命局中财星的力量较强，占 {gods.财_pct}%，平时经手的钱和事务都不少，养成记账和预算的习惯会很有帮助。钱进来容易，留下来要靠规划。同时适当分散精力，不必把所有机会都揽在身上，留出余力应对变化。"
    - "从财运看，财星对你来说是需要拿捏分寸的力量。机会多不等于都要抓，揽下的事情和钱款往来越多，压力也越大；量力而行、守住本金，比冒险扩张更适合你。财务上保守一点不是坏事，清楚的边界和适度的储蓄，能帮你避开很多不必要的麻烦。可以把收入分成生活、储备和自我提升几部分，先守住储备，再考虑其他用途，心里会更有底。财星在你的命局里占 {gods.财_pct}%，力量偏强，赚钱的机会通常不缺，关键在于取舍与规划。学会说“不”，也是一种理财能力。把收入的一部分固定存下来，比追逐更多机会更能带来安全感。"
  status: draft
  author: claude
  reviewer: null
  updated: 2026-11-13

