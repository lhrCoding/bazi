- id: CH7-WEALTH-XIAN-QIANG
  slot: CH7-WEALTH
  when: {all: [{f: wealth.role, eq: 闲}, {f: wealth.level, eq: 强}]}
  asserts: []
  priority: 50
  length: [200, 300]
  polish_allowed: true
  variants:
    - "财运方面，财星在你的命局里不算关键，既不是主要助力，也不构成负担。钱财更多随事业和能力自然增长，把重心放在提升本事上，收入会水到渠成。与其把注意力放在钱上，不如把它放在专业和健康上，后两者稳了，财务自然跟着稳。具体做法上，按月储蓄、适度消费，把更多心思放在提升职业能力上，收入自然会随之增长。你命局中财星的力量较强，占 {gods.财_pct}%，平时经手的钱和事务都不少，养成记账和预算的习惯会很有帮助。钱进来容易，留下来要靠规划。同时适当分散精力，不必把所有机会都揽在身上，留出余力应对变化。"
    - "从财运看，财星在你的命局里属于中性的位置。不必刻意追逐财富，也不用过分担心，按部就班地工作、合理安排储蓄，财务就能保持平稳。合理消费、适度储蓄、少做冲动决定，就足以让你的财务状况保持在舒适的水平，日子会过得踏实安心。日常保持清楚的账目和合理的预算就足够，不必为财务过度焦虑，也不必刻意追求额外的收入。财星在你的命局里占 {gods.财_pct}%，力量偏强，赚钱的机会通常不缺，关键在于取舍与规划。学会说“不”，也是一种理财能力。把收入的一部分固定存下来，比追逐更多机会更能带来安全感。"
  status: draft
  author: claude
  reviewer: null
  updated: 2026-11-13

