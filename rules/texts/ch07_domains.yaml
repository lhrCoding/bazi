- id: CH7-CAREER-SHISHANG-WANG
  slot: CH7-CAREER
  when: {all: [{f: career.mode, eq: 食伤}, {f: strength.direction, eq: 偏旺}]}
  asserts: []
  priority: 50
  length: [200, 300]
  polish_allowed: true
  variants:
    - "事业上，对你最有帮助的是食伤这股力量。它代表技能、表达和创造，所以你更适合靠手艺和作品立足，比如技术研发、设计、写作、内容创作、教学培训，或自主空间较大的岗位。专业能力是你最硬的底气，持续打磨一门手艺，会比频繁换方向更有回报，作品本身就会替你说话。起步阶段可以选一个细分方向深入，先做出几个有代表性的成果；等作品和口碑积累起来，再考虑独立接项目或开拓个人品牌。你的命局整体偏旺，精力和承受力都比较足，可以主动争取更大的舞台，承担更多责任。不过也要给团队留出空间，独揽一切反而会限制发展。在选择方向时，可以优先考虑成长空间大、对能力要求高的机会，你有足够的精力去应对挑战。"
    - "从命局看，你的事业助力来自食伤：把会的东西做出来、讲出来，就是你最好的名片。适合技术型、创意型、内容型的工作，也适合自由职业或在组织里保留较大自主空间的角色。建立自己的作品集或代表性成果，让别人一看就知道你能做什么，机会自然会更多，议价能力也会更强。如果在组织里工作，可以争取能发挥专长的岗位，避免长期做与技能无关的杂务，那会消耗你的热情。整体偏旺的你适合主动出击，敢于接挑战、带团队，往往能更快地走到前面。同时注意分配精力，别让工作挤占了全部生活。面对新机会，不妨多一些主动，你的承受力能撑起更快的发展节奏，关键是方向要选对。"
  status: draft
