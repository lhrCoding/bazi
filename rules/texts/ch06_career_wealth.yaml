# 第 6 章 槽位 CH6-CAREER「事业」与 CH6-WEALTH「财务」（第 1 批 B1，草稿）
# 维度：item.stem_god（5）× item.tier_group（3：好 / 平 / 守）= 15 / 槽位。每条 40–70 字，2 个变体；各 1 条兜底。
# 循环槽位：5 年中同一十神组可能出现两次（如甲、乙同组）。同一条目第二次命中时按 occurrence 重新哈希选变体，可能与上次相同
#   （README §5.2，用户决定不改公式）；每条写 2 个实质不同的变体，后续可给高频条目追加第 3 个变体降低重复概率。
# 写法约定：
#   - 不写年份、干支、五行；不写“喜 / 忌”；语气按 tier_group：好 → 积极，平 → 中性，守 → 谨慎但不恐吓。
#   - 财务段：只谈收支习惯与取舍，不出现任何投资品种、不承诺收入、不出现“破财 / 破产”；
#     避免含五行字的日常词（资金、现金、金钱、薪水、水平 等），以免触发 L6 / R-CHECK 误报。
# 组代码：BIJIE=比劫、YIN=印、SHISHANG=食伤、CAI=财、GUANSHA=官杀；HAO=好、PING=平、SHOU=守。

