  status: draft
  author: mingli-expert
  reviewer: null
  updated: 2026-10-29
  notes: "印为第一忌神：S-YIN（偏旺）或从杀 / 从儿 / 从势（从弱）。从弱时原局印星很少，故不写“已经足够多”，只写“再多的生扶”。"

