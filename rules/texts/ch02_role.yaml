    - "{yongshen.yong}是你的用神，对应十神里的食伤，占全盘 {gods.食伤_pct}%。食伤像一条把能量引出去的渠道，流动起来，田地才会有收成。对你来说，打磨一门手艺、经营自己的作品、在合适的场合表达观点，都是让用神发挥作用的方式。"
  status: draft
  author: mingli-expert
  reviewer: null
  updated: 2026-10-29

- id: CH2-ROLE-YONG-CAI
  slot: CH2-ROLE-YONG
  when: {all: [{f: yongshen.yong_god, eq: 财}]}
  asserts: []
  priority: 50
  length: [80, 130]
  polish_allowed: true
  variants:
    - "你的用神是{yongshen.yong}。在你的命局里，它是财星，代表你能掌握和经营的资源，目前占 {gods.财_pct}%。财星为用，意味着把精力落在具体的事务和成果上，对你最有帮助：做预算、管项目、经营客户，越务实，越能把自身的力量转化为收获。"
    - "{yongshen.yong}是你的用神，对应十神里的财星，占全盘 {gods.财_pct}%。财星不只是钱，更是可以被你经营的东西：时间、项目、人脉和手上的业务。对你来说，设定可衡量的目标、一步步把事情做出结果，就是让用神发力的方式。"
  status: draft
  author: mingli-expert
  reviewer: null
  updated: 2026-10-29

- id: CH2-ROLE-YONG-GUANSHA
  slot: CH2-ROLE-YONG
  when: {all: [{f: yongshen.yong_god, eq: 官杀}]}
  asserts: []
  priority: 50
  length: [80, 130]
  polish_allowed: true
  variants:
    - "你的用神是{yongshen.yong}。在你的命局里，它是官杀，代表规则、责任与外部要求，目前占 {gods.官杀_pct}%。官杀为用，说明适度的约束对你是好事：明确的目标、清晰的考核、需要担当的位置，能把你的能量引到清楚的方向上。"
    - "{yongshen.yong}是你的用神，对应十神里的官杀，占全盘 {gods.官杀_pct}%。很多人把官杀只理解为压力，其实它也是秩序和方向。对你来说，进入规则清楚的环境、接受有挑战的任务、承担一份明确的责任，往往能让你发挥得更好。"
  status: draft
  author: mingli-expert
  reviewer: null
  updated: 2026-10-29
  notes: "官杀为用可能来自 S-BI-GUAN（偏旺）、从杀（偏弱）或调候覆盖，正文不写“充沛的能量”等只对偏旺成立的话。"

