# ======================= CH2-ROLE-JI =======================
- id: CH2-ROLE-JI-BIJIE
  slot: CH2-ROLE-JI
  when: {all: [{f: yongshen.ji1_god, eq: 比劫}]}
  asserts: []
  priority: 50
