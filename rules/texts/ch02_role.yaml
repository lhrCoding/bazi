  variants:
    - "需要节制的五行里，排第一位的是{yongshen.ji1}，在你的命局里它是比劫，占 {gods.比劫_pct}%。比劫是同类的力量，过多时容易变成固执己见或与人争抢。节制并不是疏远朋友，而是在合作中把分工和利益讲清楚，也给别人的意见留出位置。"
    - "{yongshen.ji1}是你需要节制的第一个五行，对应比劫，占 {gods.比劫_pct}%。在你的命局里，“我”这一方的力量已经不弱，再加码容易冲动、好胜。遇到它旺的阶段，凡事多听一种意见，合伙、共同出钱之类的事情尤其要把规则谈在前面。"
  status: draft
  author: mingli-expert
  reviewer: null
  updated: 2026-10-29
  notes: "比劫为第一忌神：偏旺（S-BI-*）或从财。从财时日主本身极弱，故第二变体写“不弱”而非“够强”，避免与从财的结构字面冲突。"

