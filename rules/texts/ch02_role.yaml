# 第 2 章 槽位 CH2-ROLE-YONG / CH2-ROLE-XI / CH2-ROLE-JI「各五行的作用」（第 1 批 B1，草稿）
# 维度：角色 × 该五行对应的十神组（3×5=15）。每条 80–130 字，2 个变体；三个槽位各 1 条兜底。
# 触发字段：ROLE-YONG 用 yongshen.yong_god；ROLE-XI 用 yongshen.xi1_god；ROLE-JI 用 yongshen.ji1_god。
#   说明：report-sections.md 写“喜 1–2、忌 1–2”，但字段字典只有 xi1_god / ji1_god，没有第二喜神 / 忌神的十神字段，
#   本批先按“第一喜神、第一忌神各 1 条”写；完整列表在部分变体里用 {yongshen.xi} / {yongshen.ji} 带出。
#   若要写第二条，需要先在字段字典增加 xi2_god / ji2_god（见 batches.yaml 自检记录）。
# 写法约定：
#   - 五行只用占位符（{yongshen.yong} 等），十神组名直接写出（when 已锁定），百分比用对应的 gods.<组>_pct。
#   - 用神可能来自扶抑、从格或调候覆盖，同一十神组在不同来源下方向不同（如官杀为用可能是身旺制比劫，也可能是从杀），
#     所以正文只讲“这股力量在生活里是什么、怎么用好”，不写“因为你偏弱 / 偏旺”。
#   - 百分比可能很小（用神缺位且未互换、调候五行 <10%），正文不写“充足”“很多”之类与数值可能冲突的词。
#   - 忌神段不恐吓：“节制不等于排斥”。

# ======================= CH2-ROLE-YONG =======================
- id: CH2-ROLE-YONG-BIJIE
  slot: CH2-ROLE-YONG
  when: {all: [{f: yongshen.yong_god, eq: 比劫}]}
  asserts: []
  priority: 50
  length: [80, 130]
  polish_allowed: true
  variants:
    - "你的用神是{yongshen.yong}。在你的命局里，它是比劫，也就是和你同类、能并肩的力量，目前占 {gods.比劫_pct}%。比劫的帮助来自同伴、团队和自身的底气。对你来说，找到志同道合的合作者、建立自己的圈子、多做能增强自信的事，都是在用好这股力量。"
    - "{yongshen.yong}是你的用神，对应十神里的比劫，占全盘 {gods.比劫_pct}%。比劫像身边一起扛事的兄弟姐妹：有它在，压力会被分摊，你也更敢做决定。现实中，与可靠的伙伴合作、加入能互相支持的社群，往往比单打独斗更顺。"
  status: draft
  author: mingli-expert
  reviewer: null
  updated: 2026-10-29

- id: CH2-ROLE-YONG-YIN
  slot: CH2-ROLE-YONG
  when: {all: [{f: yongshen.yong_god, eq: 印}]}
  asserts: []
  priority: 50
  length: [80, 130]
  polish_allowed: true
  variants:
    - "你的用神是{yongshen.yong}。在你的命局里，它扮演印星的角色，目前占 {gods.印_pct}%。印星代表生扶与支持：学习、资质、长辈和体系的帮助，也包括让你能停下来恢复的时间和空间。所以对你来说，系统地学、找对平台、给自己留出充电期，都是在补用神。"
    - "{yongshen.yong}是你的用神，对应十神里的印星，占全盘 {gods.印_pct}%。印星的作用像一个稳定的后方：它不替你冲锋，却让你有底气、有退路。现实中，考取资质、跟随好老师、进入重视培养的团队，往往能让这股力量真正发挥出来。"
  status: draft
  author: mingli-expert
  reviewer: null
  updated: 2026-10-29

- id: CH2-ROLE-YONG-SHISHANG
  slot: CH2-ROLE-YONG
  when: {all: [{f: yongshen.yong_god, eq: 食伤}]}
  asserts: []
  priority: 50
  length: [80, 130]
  polish_allowed: true
  variants:
