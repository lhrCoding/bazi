# ======================= CH3-GOD 突出十神（循环，各 1 条） =======================
- id: CH3-GOD-BIJIAN-Y
  slot: CH3-GOD
  when: {all: [{f: item.ten_god, eq: 比肩}, {f: item.is_favorable, eq: true}]}
  asserts: []
  priority: 50
  length: [130, 180]
  polish_allowed: true
  variants:
    - "比肩在你的命局里比较突出，关键词是独立、自主、重朋友。你习惯自己拿主意，不太依赖别人的安排，也很看重朋友之间的平等和义气。比劫对你是有帮助的力量，所以这份独立值得多用：自己能做主的工作、和志同道合的人一起做事，都容易让你发挥出来。在做重要决定时，也可以听听朋友的看法，独立和合作并不矛盾。"
    - "你身上的比肩特质很明显：有主见、能自立，交朋友讲究真心和平等。对你来说，比劫是值得依靠的力量，意味着同伴、合作者和你自己的底气都能帮到你。遇到大事时，找几个信得过的人一起商量、一起扛，往往比独自硬撑更顺。你的这份重情义，也会让朋友在你需要的时候同样愿意站出来，彼此支持、彼此成就。"
  status: draft
  author: claude
  reviewer: null
  updated: 2026-11-13

