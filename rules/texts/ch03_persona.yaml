- id: CH3-GOD-SHISHEN-Y
  slot: CH3-GOD
  when: {all: [{f: item.ten_god, eq: 食神}, {f: item.is_favorable, eq: true}]}
  asserts: []
  priority: 50
  length: [130, 180]
