# 第 3 章「性格与天赋」（第 2 批 B2，草稿）
# 槽位：CH3-BASE（日干底色 10）、CH3-GOD（突出十神 10×2）、CH3-STYLE（做事风格 6）、CH3-TALENT（天赋 5×2）、
#       CH3-SHENSHA（吉神点缀 4，非必需、无兜底）；必需槽位各 1 条兜底。CH3-PERSONA-LINE 是代码模板，不走素材。
# 口径：report-sections.md §6（日干意象、十神关键词与天赋方向）。
# 写法约定：
#   - 性格写倾向，不下断语；优点与可留意并列，可留意写成“可以怎么做”，不贬低。
#   - CH3-GOD 不出现五行字（避免 L6），只讲十神；is_favorable=true 写“值得多用”，false 写“用得有分寸”。
#   - 不写年份、干支字面；术语后不加括号（引擎自动加注）。

# ======================= CH3-BASE 日干性格底色 =======================
- id: CH3-BASE-JIA
  slot: CH3-BASE
  when: {all: [{f: day.stem, eq: 甲}]}
  asserts: []
  priority: 50
  length: [150, 220]
  polish_allowed: true
  variants:
    - "你的日主是甲木，意象是一棵向上生长的大树。这类人做事有方向感，认准的事愿意一步步扎下根去做，身上有一种让人放心的正直与担当。朋友遇到难处时，你往往是那个愿意站出来说话的人。大树的长处是稳和直，相应地，转弯会慢一些：计划被打乱时，你可能需要比别人多一点时间调整。给自己留一些弹性，把“坚持原则”和“换个方法”分开看，你的担当会更有余地。"
    - "甲木日主的人，常被形容为一棵大树：有主干、有方向，习惯朝着一个目标持续用力。你看重做人的分寸，答应的事会尽量做到，也愿意照顾身边比自己弱的人，所以容易成为团队里的主心骨。这种向上的劲头，有时会让你对“绕路”不太耐烦。遇到僵局时，不妨先退半步看看全局，很多时候换一条路，反而更快到达你想去的地方。这份担当，会让你越走越宽。"
  status: draft
  author: claude
  reviewer: null
  updated: 2026-11-13

- id: CH3-BASE-YI
  slot: CH3-BASE
  when: {all: [{f: day.stem, eq: 乙}]}
  asserts: []
  priority: 50
  length: [150, 220]
  polish_allowed: true
  variants:
    - "你的日主是乙木，意象是花草藤蔓。它不靠硬度取胜，而是顺着环境找到生长的空间，所以你身上常有一种柔中带韧的力量：表面随和，心里其实很有数。你对细节和他人情绪都比较敏感，能察觉别人没说出口的需要。细腻的另一面是顾虑多，做决定前容易反复掂量。可以给自己设一个“考虑到此为止”的时间点，想清楚主要的两三件事就出发。"
    - "乙木日主的人像藤蔓，善于借力，也善于适应。换了环境、换了团队，你通常能较快找到自己的位置，和不同性格的人相处得来。你做事细致，审美和分寸感都不错，常在别人忽略的地方把事情做周全。需要留意的是，太在意周全时容易犹豫，或者把别人的感受放在自己前面。偶尔直接说出自己的想法，你会发现身边的人其实很愿意配合你。"
  status: draft
  author: claude
  reviewer: null
  updated: 2026-11-13

- id: CH3-BASE-BING
  slot: CH3-BASE
  when: {all: [{f: day.stem, eq: 丙}]}
  asserts: []
  priority: 50
  length: [150, 220]
  polish_allowed: true
  variants:
    - "你的日主是丙火，意象是太阳。太阳的特点是明亮、外放、照到哪里哪里就暖，所以你常给人热情开朗的印象，有你在的场合气氛容易活起来。你做事有冲劲，喜欢把想法亮出来，也乐于帮助别人。光芒足的人，有时会急于让结果被看见，或者在节奏慢的环境里坐不住。把热情分配到能持续的事情上，留一点耐心给慢慢见效的部分，你的影响力会更长久。"
    - "丙火日主的人像太阳，天生带着感染力。你表达直接、待人坦率，愿意主动打破冷场，也容易在团队里成为带动气氛和士气的人。你对新鲜事物有热情，行动起来不拖泥带水。需要留意的是，热情来得快，也可能消耗得快；当别人跟不上你的节奏时，你可能会着急。学会在关键处停一停、听一听，你的光会照得更稳，也更容易被人接住。你的温暖，本身就很珍贵。"
  status: draft
  author: claude
  reviewer: null
  updated: 2026-11-13

- id: CH3-BASE-DING
  slot: CH3-BASE
  when: {all: [{f: day.stem, eq: 丁}]}
  asserts: []
  priority: 50
  length: [150, 220]
  polish_allowed: true
  variants:
    - "你的日主是丁火，意象是烛火与灯光。它不像太阳那样铺天盖地，却能在一个角落里照得很亮、很久，所以你做事专注，愿意把一件事琢磨透。你待人温暖，善于体察，常常是朋友倾诉心事的对象。烛火怕风，相应地，你的情绪容易受环境和他人态度影响。给自己固定一些安静充电的时间，把注意力放回真正在意的事上，你的光会更稳定。"
    - "丁火日主的人像一盏灯，温和而专注。你不一定爱热闹，但对认定的事很投入，做出来的东西往往细致、有温度。你对人有同理心，能照顾到别人的感受，因此关系通常维持得长久。需要留意的是情绪的起伏：一句话、一件小事，可能让你想很久。遇到这种时候，不妨把感受写下来或说出来，比闷在心里更容易过去。慢慢来，你的温度会被更多人感受到。"
  status: draft
  author: claude
  reviewer: null
  updated: 2026-11-13

- id: CH3-BASE-WU
  slot: CH3-BASE
  when: {all: [{f: day.stem, eq: 戊}]}
  asserts: []
  priority: 50
  length: [150, 220]
  polish_allowed: true
  variants:
    - "你的日主是戊土，意象是高山。山的特点是稳、厚、不轻易动摇，所以你给人的感觉通常是可靠、有主见，遇事沉得住气。别人慌的时候，你往往还能冷静地把事情一件件理清楚。你重承诺，也愿意为身边的人撑起一片地方。山的另一面是不容易挪动：认定的看法，你可能不太愿意改。多问一句“还有没有别的可能”，你的稳重会变成更大的包容。"
    - "戊土日主的人像一座山，踏实、厚重、有定力。你做事讲究基础，不喜欢浮在表面，答应别人的事会认真兑现，因此容易赢得长期的信任。在团队里，你常常扮演压舱石的角色。需要留意的是固执的一面：当你很确定时，可能会听不进不同意见。把“坚持”留给真正重要的原则，其余的事放开一些，你会发现合作起来更轻松。稳重加上开放，会让你更受信赖。"
  status: draft
  author: claude
  reviewer: null
  updated: 2026-11-13

- id: CH3-BASE-JI
  slot: CH3-BASE
  when: {all: [{f: day.stem, eq: 己}]}
  asserts: []
  priority: 50
  length: [150, 220]
  polish_allowed: true
  variants:
    - "你的日主是己土，意象是田园与沃土。田地不张扬，却能容纳、滋养很多东西，所以你身上常有包容和务实的特质：会照顾人，也懂得把日子过得有条理。你适合把事情一点点经营起来，耐心是你的底气。田园的另一面是顾虑周全，面对选择时容易犹豫，担心照顾不到每一方。先定一个最重要的标准，再按它取舍，你会做决定得更快，也更安心。"
    - "己土日主的人像一片田园，温厚、实在、能包容。你通常不急着表现自己，却在细水长流的事情上很可靠，身边的人遇到琐碎麻烦，常会想到找你帮忙。你善于整合资源，把杂乱的事情理顺。需要留意的是，你可能太习惯照顾别人，而把自己的需要往后放，或者在两难时迟迟不定。适当为自己争取一些，并接受“不可能让所有人都满意”，你会轻松很多。"
  status: draft
  author: claude
  reviewer: null
  updated: 2026-11-13

- id: CH3-BASE-GENG
  slot: CH3-BASE
  when: {all: [{f: day.stem, eq: 庚}]}
  asserts: []
  priority: 50
  length: [150, 220]
  polish_allowed: true
  variants:
    - "你的日主是庚金，意象是刀剑与矿石。它坚硬、锋利，经得起锻打，所以你做事果断，讲义气，答应了就雷厉风行地去办。面对困难，你更愿意正面解决，而不是绕开。你的执行力常让人印象深刻，朋友遇到不公时，你也会站出来。刀剑的另一面是锋芒：话说得太直，可能伤到在意的人。说之前先想想对方能不能接住，你的直率会更有分量。"
    - "庚金日主的人像一块未经雕琢的矿石，内里坚硬，外表也不加修饰。你重义气、讲效率，不爱拖拖拉拉，交代给你的事往往能干脆利落地完成。你适合需要决断和担当的场合，越是压力大，越能显出你的本事。需要留意的是表达方式：你觉得是就事论事，别人可能听成了批评。把要求和尊重放在一起说，你会更容易得到配合。直率配上温度，就是难得的真诚。"
  status: draft
  author: claude
  reviewer: null
  updated: 2026-11-13

- id: CH3-BASE-XIN
  slot: CH3-BASE
  when: {all: [{f: day.stem, eq: 辛}]}
  asserts: []
  priority: 50
  length: [150, 220]
  polish_allowed: true
  variants:
    - "你的日主是辛金，意象是珠玉首饰。它小而精，越打磨越有光，所以你对品质和细节有天然的讲究，审美和判断力往往比较敏锐。你做事要求高，交出去的东西通常经得起推敲。你也重视体面和分寸，懂得在合适的场合说合适的话。珠玉的另一面是在意别人的眼光，一句评价可能让你反复琢磨。把评价当作参考，而不是对自己的定义，你会更自在。"
    - "辛金日主的人像一块美玉，精致、敏锐、有自己的标准。你对好坏的分辨很快，常能一眼看出哪里还能改进，因此适合需要精细判断的工作。你待人有礼，注重细节，给人干净利落的印象。需要留意的是，高标准有时会变成对自己的苛责，或者过于在意外界评价。允许事情先完成、再完美，你会做得更多，也更开心。你的讲究，会让做出的东西更有分量。"
  status: draft
  author: claude
  reviewer: null
  updated: 2026-11-13

- id: CH3-BASE-REN
  slot: CH3-BASE
  when: {all: [{f: day.stem, eq: 壬}]}
  asserts: []
  priority: 50
  length: [150, 220]
  polish_allowed: true
  variants:
    - "你的日主是壬水，意象是江河。江河流动、开阔，能绕过障碍继续向前，所以你通常思维灵活、视野宽，反应也快，善于在复杂局面里找到出路。你对新知识、新地方都有兴趣，交友面也比较广。流动的另一面是不容易停下来：兴趣多、计划多，有时难以长期守住一件事。给自己选一两个值得深耕的方向，你的聪明会沉淀成真正的积累。专注，会让你的灵气发挥得更充分。"
    - "壬水日主的人像一条大河，聪明、灵活、有包容力。你适应变化的能力强，遇到问题常能换个角度想办法，也愿意接触各种不同的人和观点。你在需要应变和整合信息的场合往往表现突出。需要留意的是难以定下来的倾向：选择太多时，你可能一直在比较。适当给自己设一些期限和边界，把“流动”变成“有方向的流动”。方向定了，你的灵活就会成为最大的优势。"
  status: draft
  author: claude
  reviewer: null
  updated: 2026-11-13

- id: CH3-BASE-GUI
  slot: CH3-BASE
  when: {all: [{f: day.stem, eq: 癸}]}
  asserts: []
  priority: 50
  length: [150, 220]
  polish_allowed: true
  variants:
    - "你的日主是癸水，意象是雨露。雨露安静、细密，润物无声，所以你常给人沉静、有内涵的感觉，善于观察，想象力也比较丰富。你未必是场合里说话最多的人，但看得清楚、想得深，常能提出别人没想到的点子。雨露的另一面是不爱表达，心里有想法却不一定说出口。试着把观察到的东西多分享一些，你会发现自己的想法比想象中更受重视。"
    - "癸水日主的人像雨露，细腻、内敛、有灵气。你对环境和人的变化很敏感，直觉常常是对的；在需要洞察力、想象力的事情上，你往往有独到之处。你重视内心世界，也需要独处来整理自己。需要留意的是，习惯把话放在心里，别人可能读不懂你的需要。找到一两个信任的人，或者用写作、作品的方式表达，你的细腻会成为优势。被理解的感觉，会让你更有力量。"
  status: draft
  author: claude
  reviewer: null
  updated: 2026-11-13

