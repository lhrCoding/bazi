# 测试素材：第 4 章最小集合 + CH3-SHENSHA-ANY（发布测试用；见同目录 README）。第 3 章必需槽位已有真实素材（rules/texts/ch03_persona.yaml，第 2 批），2026-11-13 从夹具移除
